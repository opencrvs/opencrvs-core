# config to don't allow the browser to render the page inside an frame or iframe
# and avoid clickjacking http://en.wikipedia.org/wiki/Clickjacking
# if you need to allow [i]frames, you can use SAMEORIGIN or even set an uri with ALLOW-FROM uri
# https://developer.mozilla.org/en-US/docs/HTTP/X-Frame-Options
add_header X-Frame-Options SAMEORIGIN;

# when serving user-supplied content, include a X-Content-Type-Options: nosniff header along with the Content-Type: header,
# to disable content-type sniffing on some browsers.
# https://www.owasp.org/index.php/List_of_useful_HTTP_headers
# currently suppoorted in IE > 8 http://blogs.msdn.com/b/ie/archive/2008/09/02/ie8-security-part-vi-beta-2-update.aspx
# http://msdn.microsoft.com/en-us/library/ie/gg622941(v=vs.85).aspx
# 'soon' on Firefox https://bugzilla.mozilla.org/show_bug.cgi?id=471020
add_header X-Content-Type-Options nosniff;

# The 'HTTP Strict Transport Security' (Strict-Transport-Security) HTTP header
# is used to control if the browser is allowed to only access a site over a
# secure connection and how long to remember the server response for thus forcing
# continued usage.Secure configuration: Return the 'Strict-Transport-Security' header
# with an appropriate timeout over a secure connection.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains;";

# A cross-domain policy file is an XML document that grants a web client,
# such as Adobe Flash Player or Adobe Acrobat (though not necessarily limited to these),
# permission to handle data across domains. When clients request content hosted on
# a particular source domain and that content make requests directed towards a domain
# other than its own, the remote domain needs to host a cross-domain policy file
# that grants access to the source domain, allowing the client to continue the transaction.
add_header X-Permitted-Cross-Domain-Policies master-only;

# Content Security Policy (CSP) tells the browser which sources it may load content from.
# https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
#
# Unlike the client, the login app compiles no JavaScript at runtime. script-src therefore
# needs neither 'unsafe-eval' nor the deploy-time wildcard: the only scripts login loads are
# its own bundle and login-config.js, which is proxied same-origin through
# /api/countryconfig/. Keep it that way. See #13246.
#
# style-src keeps 'unsafe-inline' for styled-components' runtime style injection.
#
# Every origin login talks to is reached through this nginx, so the whole policy stays on
# 'self' and {{CONTENT_SECURITY_POLICY_WILDCARD}} is deliberately absent — auth goes to
# /api/ (gateway), public config to /api/publicConfig, and country branding and copy to
# /api/countryconfig/. Adding the wildcard back would trust every subdomain — including
# ones login never contacts, such as kibana and minio-console — and buy nothing. If a new
# call needs a cross-origin source, proxy it here instead of widening this header.
#
# frame-ancestors 'none' is stricter than the X-Frame-Options: SAMEORIGIN header set above;
# both are sent because not every scanner recognises only one of them. The login form is
# never framed, so 'none' is the honest value.
#
# img-src stays 'self' data: — no plain-HTTP images (mixed content on an https deployment)
# and no blanket https:, since every image login renders is served through this nginx.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; font-src https://fonts.gstatic.com; object-src 'none'; script-src 'self' https://sentry.io/api/embed/error-page/; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:";

otel_exporter {
    endpoint ${OTEL_NGINX_EXPORTER_ENDPOINT};
}
otel_service_name ${OTEL_NGINX_SERVICE_NAME};
otel_resource_attr service.namespace ${OTEL_NGINX_SERVICE_NAMESPACE};
otel_resource_attr deployment.environment.name ${OTEL_NGINX_DEPLOYMENT_ENVIRONMENT};

server {
    listen       3020;
    server_name  localhost;
    server_tokens off;
    otel_trace ${OTEL_NGINX_TRACE};
    otel_trace_context propagate;
    otel_span_name "$request_method $uri";

    # country-config related proxy since client's manifest.json is served from country-config
    location /manifest.json {
        proxy_pass ${COUNTRY_CONFIG_URL_INTERNAL}/static/manifest.json;
    }

    # country-config related proxy since client's icon files are served from country-config
    location /images/ {
        proxy_pass ${COUNTRY_CONFIG_URL_INTERNAL}/static/images/;
    }

    location ~ ^/register(/.*)?$ {
        return 302 ${CLIENT_APP_URL}$1$is_args$args;
    }

    location /api/countryconfig/ {
        rewrite ^/api/countryconfig/(.*)$ /$1 break;
        proxy_pass ${COUNTRY_CONFIG_URL_INTERNAL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Block any request whose path contains an /internal/ segment.
    # Regex locations are evaluated before plain-prefix ones, so this
    # catches internal routes across all services at the edge.
    # See SECURITY finding H1.
    location ~* /internal(/|$) {
        return 404;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass ${GATEWAY_URL_INTERNAL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Health check endpoint that verifies country config availability
    # This endpoint performs a health check by proxying to country config's ping endpoint
    # and transforms the response format to match the expected health check format
    location = /health/ready {
        otel_trace off;
        access_log off;

        # Proxy to country config ping endpoint
        proxy_pass ${COUNTRY_CONFIG_URL_INTERNAL}/ping;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;

        # Custom error handling for health check failures
        error_page 400 404 500 502 503 504 = @health_error;
    }

    location @health_error {
        internal;
        add_header Content-Type application/json always;
        return 500 '{"status":"error","checks":{"countryconfig":{"status":"error","error":"Country config service unavailable"}}}';
    }

    # Return 404 for missing hashed assets instead of falling back to index.html.
    # Prevents old SW chunk requests from getting index.html as text/html (MIME error).
    location /assets/ {
        root   /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        # allows fallback to /index.html so SPAs work
        try_files $uri $uri/ /index.html;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

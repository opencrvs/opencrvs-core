# GENERATED FILE — DO NOT EDIT
#
# This file is managed by `opencrvs environment init` and may be overwritten.
# Put all custom Helm values in values.override.yaml, preserving the same YAML
# hierarchy used here. To remove a generated section, set its top-level key to
# null in values.override.yaml.
##################################################################################

network_policy:
  ingress_mode: deny
  egress_mode: deny
  allowed_namespaces:
    - opencrvs-{{env}}

# Default: storage_type: host_path
# host_path option is backward compatible with Docker Swarm,
# configured to use sub-directories within /data folder
# For new installations feel free to remove storage_type
storage_type: host_path

# All datastores are placed on first node (master1) for backward compatibility
# with Docker Swarm.
# For new installations feel free to remove node_selector
node_selector:
  role: data1

# MinIO and SeaweedFS are object stores with the same credentials, in the secret
# s3-opencrvs-users. A new environment has SeaweedFS only. An environment that was set
# up with MinIO keeps it for as long as the services use it, and while minio_to_seaweedfs
# copies from it, see `opencrvs environment init`.
minio:
  enabled: {{minio_enabled}}
  use_default_credentials: false
  {{#if restore_enabled}}
  restore:
    type: {{restore_type}}
  {{/if}}
  {{#if backup_enabled}}
  backup:
    type: {{backup_type}}
  {{/if}}

seaweedfs:
  enabled: {{seaweedfs_enabled}}

{{#if minio_to_seaweedfs_enabled}}
# Copies the documents from MinIO to SeaweedFS after each deployment
minio_to_seaweedfs:
  enabled: true
  {{#if services_use_seaweedfs}}
  # The services write to SeaweedFS now, so objects are written and deleted there, and
  # a check of the copy would report that as a difference
  verify: none
  {{/if}}
{{/if}}

elasticsearch:
  use_default_credentials: false

postgres:
  use_default_credentials: false
  {{#if restore_enabled}}
  restore:
    type: {{restore_type}}
  {{/if}}
  {{#if backup_enabled}}
  backup:
    type: {{backup_type}}
  {{/if}}

redis:
  auth_mode: acl

monitoring:
  enabled: true

elastalert:
  env:
    NOTIFICATION_TYPE: email
  secrets:
    smtp-config:
      - ALERT_EMAIL
      - SENDER_EMAIL_ADDRESS
      - SMTP_HOST
      - SMTP_PASSWORD
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USERNAME

# Backup configuration
backup:
  enabled: {{backup_enabled}}
  schedule: "0 1 * * *"
  backup_server_secret: backup-server-ssh-credentials
  backup_server_dir: /home/backup/{{env}}
  host: {{backup_host}}


# Restore configuration
restore:
  enabled: {{restore_enabled}}
  schedule: "0 0 * * *"
  backup_server_secret: backup-server-ssh-credentials
  backup_server_dir: /home/backup/{{restore_environment_name}}
  backup_encryption_secret: restore-encryption-secret
  host: {{restore_host}}

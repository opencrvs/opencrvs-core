mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    prometheus: null
    jaeger: null
    zipkin: null

  exporters:
    otlp/elastic:
      endpoint: apm-server.opencrvs-deps-{{env}}.svc.cluster.local:8200
      tls:
        insecure: true
  processors:
    batch:
      timeout: 15s
      send_batch_size: 1024

    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    transform/traces:
      error_mode: ignore
      trace_statements:
        # Start with the raw path.
        - set(span.attributes["http.route"], span.attributes["url.path"]) where resource.attributes["service.name"] == "traefik" and span.attributes["url.path"] != nil

        # Match getTracePath(): collapse repeated slashes.
        - replace_pattern(span.attributes["http.route"], "/+", "/") where resource.attributes["service.name"] == "traefik" and span.attributes["http.route"] != nil

        # Match getTracePath(): replace dynamic-looking segments with "#".
        - replace_pattern(span.attributes["http.route"], "/([^/]*\\.[^/]*|[0-9]+|[0-9a-fA-F]{24}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})(/|$)", "/#$$2") where resource.attributes["service.name"] == "traefik" and span.attributes["http.route"] != nil

        # Concatenate Request method and normalized URL to conform same format as NodeJs.
        - set(span.name, Concat([span.attributes["http.request.method"], span.attributes["http.route"]], " ")) where resource.attributes["service.name"] == "traefik" and span.attributes["http.request.method"] != nil and span.attributes["http.route"] != nil

        # SDK language to avoid errors in Kibana on APM -> Service Inventory -> Traefik -> Metrics.
        - delete_key(resource.attributes, "telemetry.sdk.language") where resource.attributes["service.name"] == "traefik"

        # Nginx OTEL module uses older HTTP semantic convention names, so build the span name from http.method and http.route.
        - set(span.name, Concat([span.attributes["http.method"], span.attributes["http.route"]], " ")) where (resource.attributes["service.name"] == "opencrvs_client" or resource.attributes["service.name"] == "opencrvs_login") and span.attributes["http.method"] != nil and span.attributes["http.route"] != nil

  service:
    telemetry:
      metrics:
        level: none
        readers: null
    pipelines:
      logs: null
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/elastic
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - transform/traces
          - batch
        exporters:
          - otlp/elastic

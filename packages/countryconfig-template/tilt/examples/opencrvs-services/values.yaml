ingress:
  ssl_enabled: false

env:
  OPENCRVS_ENVIRONMENT: development

credentials:
  super_user_password: password


# Horizontal Pod Autoscaler (HPA) configuration:
# Disabled by default for local environment.
hpa:
  enabled: false

# Pod Disruption Budget (PDB) configuration:
# Disabled by default for local environment.
pdb:
  enabled: false

# Dashboards is disabled by default to allow easy deployment on Apple Silicon
# If you are using x86 device, feel free to enable:
dashboards:
  enabled: false

# Expose services on Node port
service_type: NodePort

# Credentials of the S3 object store that the dependencies chart deploys, which are the RustFS defaults.
# Tilt renders the chart with `helm template`, which cannot see a secret in the cluster, so the chart
# creates the secret s3-opencrvs-users from them.
s3:
  admin_username: rustfsadmin
  admin_password: rustfsadmin

# `helm template` renders the chart again on every reload of Tilt. With random passwords, each reload would give
# the services new passwords that the datastores do not know. Default credentials stay the same on every render.
elasticsearch:
  admin_password: elasticadmin
  use_default_credentials: true

postgres:
  admin_username: postgres
  admin_password: postgres
  use_default_credentials: true

data_seed:
  enabled: false
  env:
    ACTIVATE_USERS: true

auth:
  env:
    TWO_FA_ENABLED: false

events:
  env:
    TWO_FA_ENABLED: false

# Deprecated: replaced by publish-to-registry.yml, which publishes to any container registry.
#
# The file is kept, with nothing to do, so that the workflow stays listed in the repository.
# Release branches that were cut before the replacement still carry the Docker Hub only
# version, and GitHub can only run a workflow whose file exists on the default branch.
# Remove this file once those release branches are no longer published from.
name: Deprecated workflow
run-name: Deprecated workflow, use publish-to-registry.yml
on:
  workflow_dispatch:

jobs:
  deprecated:
    runs-on: ubuntu-26.04
    steps:
      - name: Use publish-to-registry.yml instead
        run: |
          echo "::error::This workflow is deprecated and publishes nothing. Run 'Publish image to container registry' (publish-to-registry.yml) instead."
          exit 1

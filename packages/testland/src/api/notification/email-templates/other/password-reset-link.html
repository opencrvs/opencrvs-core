<!doctype html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      body {
        font-family: 'Noto Sans', sans-serif;
        color: #222;
        padding: 16px 24px;
      }

      h1 {
        font-size: 21px;
        margin-top: 32px;
        margin-bottom: 36px;
        font-weight: 700;
      }

      p {
        font-weight: 400;
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 24px;
      }

      i {
        color: #666;
        font-weight: 400;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <img
      src="{{countryLogo}}"
      alt="country_logo"
      style="max-height: 88px; max-width: 100%"
    />
    <h1>Reset your password</h1>
    <p>Hello {{firstname}},</p>
    <p>
      Someone asked to reset the password for your {{applicationName}}
      account.
    </p>

    <div style="margin-top: 32px; margin-bottom: 32px">
      <a href="{{{recoveryURL}}}">Reset your password</a>
    </div>
    <br />
    <p>
      This link expires in 1 hour and can only be used once. If you did not
      request this, you can ignore this email.
    </p>
    <br />
    <p>
      Best regards, <br />
      {{applicationName}} Team
    </p>
  </body>
</html>

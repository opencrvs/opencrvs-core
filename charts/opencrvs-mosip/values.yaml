hostname: opencrvs.localhost
ingress:
  ssl_enabled: false

storage_type: host_path

# Default image configuration for the OpenCRVS/MOSIP platform.
# These values apply to all OpenCRVS/MOSIP services unless overridden
# by a service-specific image configuration.
platform:
  # Default tag for all OpenCRVS/MOSIP images.
  tag: v2.1.1

  # Default repository for all OpenCRVS/MOSIP images,
  # for example: ghcr.io/opencrvs or myorg
  repository: ghcr.io/opencrvs

  # Secrets used to pull images from private registries, if needed.
  # Example:
  # imagePullSecrets:
  #   - name: registry-secret
  imagePullSecrets: []

# Deployment rollout strategy, applied to all three MOSIP mock/test services
# below unless overridden per-service under <service>.strategy (e.g.
# mosip_api.strategy.type).
# - Recreate: terminate the existing pod before creating its replacement.
#   Guarantees the old pod is gone before the new one starts; causes a
#   brief outage since these run a single replica.
# - RollingUpdate: Kubernetes' default gradual pod swap.
strategy:
  type: Recreate

mosip_mock:
  enabled: true
  image:
    name: mosip-mock
  env:
    FOO: bar
    SENDER_EMAIL_ADDRESS: 'test@opencrvs.org'
    ALERT_EMAIL: 'test@opencrvs.org'
    SMTP_HOST: ''
    SMTP_PORT: 575
    SMTP_USERNAME: opencrvs
    SMTP_PASSWORD: ''
    SMTP_SECURE: true
    MOSIP_WEBSUB_TOPIC: CREDENTIAL_ISSUED
    MOSIP_WEBSUB_SECRET: mosip-websub-secret

esignet_mock:
  enabled: true
  image:
    name: esignet-mock
  env:
    OIDP_CLIENT_PRIVATE_KEY_PATH: /certs/esignet-jwk.txt

mosip_api:
  enabled: true
  host_data_path: /data/sqlite
  image:
    name: mosip-api
  env:
    LOCALE: en
    OIDP_CLIENT_PRIVATE_KEY_PATH: /certs/esignet-jwk.txt
    OPENID_PROVIDER_CLAIMS: name,family_name,given_name,middle_name,birthdate,address
    DECRYPT_P12_FILE_PATH: /certs/keystore.p12
    DECRYPT_P12_FILE_PASSWORD: mosip123
    ENCRYPT_CERT_PATH: /certs/ida-partner.crt
    PARTNER_APIKEY: 123456
    PARTNER_ID: aaaaaAAAAAbbbbbBBBBBcccccCCCCCdddddDDDDD
    PARTNER_MISP_LK: crvs-partner
    SIGN_P12_FILE_PATH: /certs/keystore.p12
    SIGN_P12_FILE_PASSWORD: mosip123
    SQLITE_DATABASE_PATH: /data/sqlite/mosip-api.db
    MOSIP_AUTH_CLIENT_APP_ID: admin
    MOSIP_PACKET_AUTH_CLIENT_ID: mosip-regproc-client
    MOSIP_PACKET_AUTH_CLIENT_SECRET: abcdeABCDE123456
    MOSIP_WEBSUB_AUTH_CLIENT_ID: mosip-websub-client
    MOSIP_WEBSUB_AUTH_CLIENT_SECRET: abcdeABCDE123456
    MOSIP_WEBSUB_SECRET: mosip-websub-secret
    MOSIP_WEBSUB_TOPIC: CREDENTIAL_ISSUED
    MOSIP_CENTER_ID: 10123
    MOSIP_MACHINE_ID: 10234

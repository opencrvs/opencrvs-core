
{{- if .Values.on_restore_cronjob.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: deployment-jobs
    job-type: restore
  name: on-db-restore-cronjob
spec:
  schedule: "{{ .Values.on_restore_cronjob.schedule }}"
{{- if .Values.timezone }}
  timeZone: {{ .Values.timezone }}
{{- end }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: deployment-jobs
            job-type: restore
        spec:
          {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.events) | nindent 10 }}
          {{- include "pod-service-account-values-helper" (dict "service_name" "deployment-jobs" "Values" .Values) | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            {{- include "postgres-on-deploy.containerSpec" . | nindent 12 }}
            {{- include "elasticsearch-reindex.containerSpec" . | nindent 12 }}
          volumes:
            {{- include "postgres-on-deploy.volumes" . | nindent 10 }}
            {{- include "events.volumes" . | nindent 10 }}

{{- end }}

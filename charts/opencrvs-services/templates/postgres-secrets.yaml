{{- $namespace := .Release.Namespace }}
{{- $admin_secret := lookup "v1" "Secret" $namespace .Values.postgres.admin_user_secret_name }}
{{- $users_secret := lookup "v1" "Secret" $namespace .Values.postgres.users_secret }}
{{- $urls_secret := lookup "v1" "Secret" $namespace .Values.postgres.urls_secret }}

{{- $POSTGRES_USER := include "opencrvs.secretValue" (dict "secret" $admin_secret "key" "POSTGRES_USER" "default" (.Values.postgres.admin_username | default "")) }}
{{- $POSTGRES_PASSWORD := include "opencrvs.secretValue" (dict "secret" $admin_secret "key" "POSTGRES_PASSWORD" "default" (.Values.postgres.admin_password | default "")) }}

{{- if not $admin_secret }}
{{- if and $POSTGRES_USER $POSTGRES_PASSWORD }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.admin_user_secret_name }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  POSTGRES_USER: {{ $POSTGRES_USER | b64enc }}
  POSTGRES_PASSWORD: {{ $POSTGRES_PASSWORD | b64enc }}
{{- else if include "opencrvs.clusterReadable" . }}
{{- fail (printf "postgres.admin_username and postgres.admin_password are required for installation: the secret %s does not exist" .Values.postgres.admin_user_secret_name) }}
{{- end }}
{{- end }}

{{- $users := dict }}
{{- $db_urls := dict }}
{{- $EVENTS_DB := .Values.postgres.events_db }}
{{- range $role := list "EVENTS_APP" "EVENTS_MIGRATOR" "EVENTS_ANALYTICS" }}
  {{- $default_user := index $.Values.postgres (lower (trimPrefix "EVENTS_" $role) | printf "events_%s") }}
  {{- $user := include "opencrvs.secretValue" (dict "secret" $users_secret "key" (printf "%s_POSTGRES_USER" $role) "default" $default_user) }}
  {{- $password := include "opencrvs.secretValue" (dict "secret" $users_secret "key" (printf "%s_POSTGRES_PASSWORD" $role) "default" (randAlphaNum 32)) }}
  {{- $_ := set $users (printf "%s_POSTGRES_USER" $role) $user }}
  {{- $_ := set $users (printf "%s_POSTGRES_PASSWORD" $role) $password }}
  {{- $url_key := printf "events_%s_db_url" (lower (trimPrefix "EVENTS_" $role)) }}
  {{- $_ := set $db_urls $url_key (printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $user $password $.Values.postgres.host $.Values.postgres.port $EVENTS_DB $.Values.postgres.sslmode) }}
{{- end }}
{{- if $POSTGRES_PASSWORD }}
{{- $_ := set $db_urls "events_superuser_db_url" (printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $POSTGRES_USER ($POSTGRES_PASSWORD | urlquery) $.Values.postgres.host $.Values.postgres.port $EVENTS_DB $.Values.postgres.sslmode) }}
{{- end }}

{{- if not $users_secret }}
{{/*
Postgres regular users (per database)
Secret is used to create users and assign appropriate roles
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.users_secret }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $val := $users }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
{{- end }}

{{- if not $urls_secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.urls_secret }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $val := $db_urls }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
{{- end }}

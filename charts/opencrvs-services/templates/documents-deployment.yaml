---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: documents
    service_name: opencrvs_documents
  name: documents
spec:
  replicas: {{ .Values.documents.replicas | default 1 }}
  {{- include "strategy-helper" (dict "service_name" "documents" "Values" .Values) | indent 2 }}
  selector:
    matchLabels:
      app: documents
  template:
    metadata:
      annotations:
        lastdeploy-timestamp: {{ now | quote }}
      labels:
        app: documents
        service_name: opencrvs_documents
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.documents) | nindent 6 }}
      {{- include "pod-service-account-values-helper" (dict "service_name" "documents" "Values" .Values) | nindent 6 }}
      containers:
        - image: {{ include "opencrvs.image" (dict "root" . "service" .Values.documents) }}
          imagePullPolicy: {{ .Values.documents.image.pullPolicy | default .Values.platform.imagePullPolicy }}
          name: documents
          env:
          {{- include "render-otel-env-vars" (dict "Values" .Values "Release" .Release) }}
            - name: COUNTRY_CONFIG_URL
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
            - name: DOCUMENTS_PORT
              value: "9050"
            - name: CERT_PUBLIC_KEY_PATH
              value: /secrets/public-key.pem
            - name: S3_HOST
              value: {{ .Values.s3.host | quote }}
            - name: S3_PORT
              value: {{ .Values.s3.port | quote }}
            - name: S3_PROTOCOL
              value: '{{ .Values.s3.external_protocol | default (include "http-scheme" .) }}:'
            - name: S3_PUBLIC_URL
              value: {{ include "s3-external-url" . }}
          {{- if or (eq .Values.s3.auth_mode "auto") (eq .Values.s3.auth_mode "use_secret") }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_ACCESS_KEY
                  name: {{ .Values.s3.users_secret }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_SECRET_KEY
                  name: {{ .Values.s3.users_secret }}
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "documents" "Values" .Values) }}
          {{- include "resources-helper" (dict "service_name" "documents" "Values" .Values) | indent 10 }}
          {{- include "probes-helper" (dict "service_name" "documents" "Values" .Values) | indent 10 }}
          ports:
            - containerPort: {{ .Values.documents.port }}
              protocol: TCP
          volumeMounts:
            - mountPath: /secrets/public-key.pem
              name: public-key
              subPath: public-key.pem
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: public-key.pem
                path: public-key.pem
            name: {{ .Release.Name }}-cert-tls
          name: public-key

{{- include "service-account-helper" (dict "service_name" "documents" "Values" .Values) }}

{{- include "network-policy-rules" (dict "service_name" "documents" "Values" .Values) }}

{{- include "service-helper" (dict "service_name" "documents" "Values" .Values) }}

{{- include "hpa-helper" (dict "service_name" "documents" "Values" .Values) }}

{{- include "pdb-helper" (dict "service_name" "documents" "Values" .Values) }}

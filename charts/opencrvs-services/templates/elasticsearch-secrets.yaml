{{/*
FIXME: Revise usage of elasticsearch secrets once this bug is resolved:
https://github.com/opencrvs/opencrvs-core/issues/9657
*/}}
{{- $namespace := .Release.Namespace }}
{{- $admin_secret := lookup "v1" "Secret" $namespace .Values.elasticsearch.admin_user_secret_name }}
{{- $users_secret := lookup "v1" "Secret" $namespace .Values.elasticsearch.users_secret }}
{{- $urls_secret := lookup "v1" "Secret" $namespace .Values.elasticsearch.urls_secret }}

{{- $ELASTIC_PASSWORD := include "opencrvs.secretValue" (dict "secret" $admin_secret "key" "ELASTIC_PASSWORD" "default" (.Values.elasticsearch.admin_password | default "")) }}
{{- if not $admin_secret }}
{{- if $ELASTIC_PASSWORD }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.elasticsearch.admin_user_secret_name }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  ELASTIC_PASSWORD: {{ $ELASTIC_PASSWORD | b64enc }}
{{- else if include "opencrvs.clusterReadable" . }}
{{- fail (printf "elasticsearch.admin_password is required for installation: the secret %s does not exist" .Values.elasticsearch.admin_user_secret_name) }}
{{- end }}
{{- end }}

{{- $secrets := dict }}
{{- $elastic_hosts := dict }}
{{- $elastic_urls := dict }}
{{- range $user_props := .Values.elasticsearch.auth_users }}
  {{- $user_key_val := split ":" $user_props }}
  {{- $prefix := $user_key_val._0 }}
  {{- $username := include "opencrvs.secretValue" (dict "secret" $users_secret "key" (printf "%s_ELASTIC_USERNAME" $prefix) "default" ($user_key_val._1 | default $prefix)) }}
  {{- $password := include "opencrvs.secretValue" (dict "secret" $users_secret "key" (printf "%s_ELASTIC_PASSWORD" $prefix) "default" (randAlphaNum 32)) }}
  {{- $host := printf "%s:%s@%s:%s" $username $password $.Values.elasticsearch.host ($.Values.elasticsearch.port | toString) }}
  {{- $_ := set $secrets (printf "%s_ELASTIC_USERNAME" $prefix) $username }}
  {{- $_ := set $secrets (printf "%s_ELASTIC_PASSWORD" $prefix) $password }}
  {{- $_ := set $elastic_hosts (printf "%s_ELASTIC_HOST" $prefix) $host }}
  {{- $_ := set $elastic_urls (printf "%s_ELASTIC_URL" $prefix) (printf "http://%s" $host) }}
{{- end }}

{{- if not $users_secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.elasticsearch.users_secret }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $val := $secrets }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
{{- end }}

{{- if not $urls_secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.elasticsearch.urls_secret }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $val := $elastic_urls }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
  {{- range $key, $val := $elastic_hosts }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
{{- end }}

{{/*
Creates the secret from values when neither the secret nor its old name exists.
Without values, it fails only when the chart can read the cluster. `helm template`
cannot, so it cannot tell a missing secret from one that it does not see, and its
output is applied to a cluster where the secret may exist. Every namespace has the
ConfigMap kube-root-ca.crt, which shows that the cluster is readable.
Prevents secret mutation between helm upgrades.
*/}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.s3.users_secret }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "minio-opencrvs-users" }}
{{- if not (or $secret $legacy) }}
{{- $username := .Values.s3.admin_username | default "" }}
{{- $password := .Values.s3.admin_password | default "" }}
{{- if and $username $password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.users_secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  S3_ACCESS_KEY: {{ $username | b64enc }}
  S3_ADMIN_ACCESS_KEY: {{ $username | b64enc }}
  S3_ADMIN_SECRET_KEY: {{ $password | b64enc }}
  S3_SECRET_KEY: {{ $password | b64enc }}
{{- else if lookup "v1" "ConfigMap" .Release.Namespace "kube-root-ca.crt" }}
{{- fail (printf "s3.admin_username and s3.admin_password are required for installation: the secret %s does not exist" .Values.s3.users_secret) }}
{{- end }}
{{- end }}

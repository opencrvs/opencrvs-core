{{- if .Values.data_seed.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "3"
  labels:
    app: deployment-jobs
  name: data-seed
  namespace: {{ .Release.Namespace }}
spec:
  template:
    metadata:
      labels:
        app: deployment-jobs
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.data_seed) | nindent 6 }}
      {{- include "pod-service-account-values-helper" (dict "service_name" "deployment-jobs" "Values" .Values) | nindent 6 }}
      containers:
        - name: data-seed
          image: {{ include "opencrvs.image" (dict "root" . "service" .Values.data_seed) }}
          imagePullPolicy: {{ .Values.data_seed.image.pullPolicy | default .Values.platform.imagePullPolicy }}
          env:
            - name: AUTH_HOST
              value: "http://auth.{{ .Release.Namespace }}.svc.cluster.local:4040"
            - name: GATEWAY_HOST
              value: "http://gateway.{{ .Release.Namespace }}.svc.cluster.local:7070"
            - name: COUNTRY_CONFIG_HOST
              value: http://countryconfig.{{ .Release.Namespace }}.svc.cluster.local:3040
            - name: SUPER_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: SUPER_USER_PASSWORD
                  name: opencrvs-superuser
          {{- if or (eq .Values.s3.auth_mode "auto") (eq .Values.s3.auth_mode "use_secret") }}
            - name: S3_ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_ADMIN_ACCESS_KEY
                  name: {{ .Values.s3.users_secret }}
            - name: S3_ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_ADMIN_SECRET_KEY
                  name: {{ .Values.s3.users_secret }}
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "data_seed" "Values" .Values) }}
      restartPolicy: "Never"
  backoffLimit: 0

{{- end }}

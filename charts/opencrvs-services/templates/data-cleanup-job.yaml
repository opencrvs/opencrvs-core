{{- if .Values.data_cleanup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: data-cleanup
  name: data-cleanup
  namespace: {{ .Release.Namespace }}
spec:
  template:
    metadata:
      labels:
        app: data-cleanup
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.postgres) | nindent 6 }}
      {{- include "pod-service-account-values-helper" (dict "service_name" "deployment-jobs" "Values" .Values) | nindent 6 }}
      containers:
        - name: cleanup-postgres
          image: {{ include "opencrvs.imageReference" .Values.postgres }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "🔁 Dropping database '${POSTGRES_DB}' and roles..."
              psql -h $POSTGRES_HOST -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 <<EOF
              SELECT pg_terminate_backend(pid)
              FROM pg_stat_activity
              WHERE datname = '$POSTGRES_DB' AND pid <> pg_backend_pid();

              DROP DATABASE IF EXISTS "$POSTGRES_DB" WITH (FORCE);

              DROP ROLE IF EXISTS "$EVENTS_MIGRATOR_ROLE";
              DROP ROLE IF EXISTS "$EVENTS_APP_ROLE";
              EOF
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host }}
          # FIXME: Double check property name "managed"
          {{- if eq .Values.postgres.auth_mode "disabled" }}
            - name: PGPASSWORD
              value: postgres
            - name: POSTGRES_USER
              value: postgres
          {{- else if eq .Values.postgres.auth_mode "auto" }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: {{ .Values.postgres.admin_user_secret_name }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: {{ .Values.postgres.admin_user_secret_name }}
          {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.events_db | replace "-" "_" }}
            - name: EVENTS_APP_ROLE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.users_secret }}
                  key: EVENTS_APP_POSTGRES_USER
            - name: EVENTS_MIGRATOR_ROLE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.users_secret }}
                  key: EVENTS_MIGRATOR_POSTGRES_USER
        - name: cleanup-minio
          image: {{ include "opencrvs.imageReference" .Values.minio }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              MINIO_BUCKET=${MINIO_BUCKET:-ocrvs}
              echo "Running minio cleanup script..."
              mc alias set myminio http://$MINIO_HOST:$MINIO_PORT ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}
              mc rm --recursive --force myminio/$MINIO_BUCKET
              mc rb myminio/$MINIO_BUCKET
              [ "${make_bucket:-true}" == 'true' ] && mc mb myminio/$MINIO_BUCKET
              echo "Cleanup complete!"
          env:
            - name: MINIO_HOST
              value: {{ .Values.minio.host }}
            - name: MINIO_PORT
              value: {{ .Values.minio.port | quote }}
          {{- if or (eq .Values.minio.auth_mode "auto") (eq .Values.minio.auth_mode "use_secret") }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: MINIO_ROOT_USER
                  name: {{ .Values.minio.users_secret }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MINIO_ROOT_PASSWORD
                  name: {{ .Values.minio.users_secret }}
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "data_cleanup" "Values" .Values) }}
        - name: cleanup-elasticsearch
          image: {{ include "opencrvs.image" (dict "root" . "service" .Values.utilities) }}
          imagePullPolicy: {{ .Values.utilities.image.pullPolicy | default .Values.platform.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              approved_words="${ES_INDEX_PREFIX:-events}_ ${ELASTICSEARCH_INDEX_NAME:-ocrvs} ${ES_REINDEXING_STATUS_INDEX:-reindexing_status}"
              indices=$(curl -sS -XGET http://$ELASTICSEARCH_HOST/_cat/indices?h=index)
              echo "Running elasticsearch cleanup script..."
              echo "--------------------------"
              echo "🧹 cleanup for indices: $approved_words from $indices"
              echo "--------------------------"
              for index in $indices; do
                for approved in $approved_words; do
                  case "$index" in
                    "$approved"*)
                      echo "Delete index $index..."
                      curl -sS -XDELETE "http://$ELASTICSEARCH_HOST/$index"
                      break
                      ;;
                  esac
                done
              done
          env:
          {{- if eq .Values.elasticsearch.auth_mode "disabled" }}
            - name: ELASTICSEARCH_HOST
              value: "{{ .Values.elasticsearch.host }}:{{ .Values.elasticsearch.port }}"
          {{- else if or (eq .Values.elasticsearch.auth_mode "auto") (eq .Values.elasticsearch.auth_mode "use_secret") }}
            - name: ELASTICSEARCH_HOST
              valueFrom:
                secretKeyRef:
                  key: SEARCH_ELASTIC_HOST
                  name: {{ .Values.elasticsearch.urls_secret }}
          {{- end }}
          {{- include "render-env-vars" (dict "service_name" "data_cleanup" "Values" .Values) }}
      restartPolicy: "OnFailure"

{{- end }}

{{/*
FIXME Remove after OpenCRVS v2.4
The secret minio-opencrvs-users was renamed to s3-opencrvs-users and its keys were renamed too.
Copy it once, so that an upgrade keeps the credentials. The old secret is left in place.
s3-secrets.yaml creates the secret from values when neither of them exists.
*/}}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "minio-opencrvs-users" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.s3.users_secret }}
{{- if and $legacy (not $secret) }}
{{- $keys := dict "S3_ACCESS_KEY" "MINIO_ACCESS_KEY" "S3_SECRET_KEY" "MINIO_SECRET_KEY" "S3_ADMIN_ACCESS_KEY" "MINIO_ROOT_USER" "S3_ADMIN_SECRET_KEY" "MINIO_ROOT_PASSWORD" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.users_secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $new, $old := $keys }}
  {{- if hasKey $legacy.data $old }}
  {{ $new }}: {{ index $legacy.data $old }}
  {{- end }}
  {{- end }}
{{- end }}

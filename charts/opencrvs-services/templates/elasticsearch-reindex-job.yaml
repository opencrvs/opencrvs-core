{{- if .Values.elasticsearch.reindex_enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
  labels:
    app: deployment-jobs
  name: elasticsearch-reindex
  namespace: {{ .Release.Namespace }}
spec:
  # A second run fails on the reindex lock, so a retry cannot help. Fail the hook at once.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: deployment-jobs
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.events) | nindent 6 }}
      {{- include "pod-service-account-values-helper" (dict "service_name" "deployment-jobs" "Values" .Values) | nindent 6 }}
      containers:
        {{- include "elasticsearch-reindex.containerSpec" . | nindent 8 }}
      restartPolicy: Never
      volumes:
        {{- include "events.volumes" . | nindent 8 }}

{{- end }}

{{ if and .Values.rustfs.enabled (eq (include "rustfs.restore_enabled" .) "true") }}
{{- if eq .Values.rustfs.restore.type "dump" }}
---
apiVersion: batch/v1
{{ if .Values.restore.cronjob }}
kind: CronJob
{{- else }}
kind: Job
{{- end }}
metadata:
  name: rustfs-restore
  labels:
    app: rustfs
    job-type: restore
spec:
  {{ if .Values.restore.cronjob }}
  schedule: {{ .Values.rustfs.restore_schedule | default .Values.restore.schedule }}
  {{- if .Values.timezone }}
  timeZone: {{ .Values.timezone }}
  {{- end }}
  jobTemplate:
    spec:
  {{- end }}
      template:
        metadata:
          labels:
            app: rustfs
            job-type: restore
        spec:
          {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.rustfs) | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: restore
              command: ["/scripts/restore.sh"]
              image: {{ include "opencrvs.imageReference" .Values.utilities }}
              env:
                - name: S3_ADMIN_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-opencrvs-users
                      key: S3_ADMIN_ACCESS_KEY
                - name: S3_ADMIN_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-opencrvs-users
                      key: S3_ADMIN_SECRET_KEY
                - name: S3_ENDPOINT
                  value: http://rustfs:{{ .Values.rustfs.port }}
                - name: ENCRYPT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_encryption_secret }}
                      key: backup_encryption_key
                - name: BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.restore.backup_server_secret }}
                      key: user
                - name: BACKUP_HOST
                  value: {{ default .Values.restore.host .Values.rustfs.restore.host }}
                - name: BACKUP_REMOTE_DIR
                  value: {{ default .Values.restore.backup_server_dir .Values.rustfs.backup_server_dir }}
              {{- include "render-env-vars" (dict "service_name" "restore" "Values" .Values) | nindent 4 }}
              volumeMounts:
                - name: backup-ssh-key
                  mountPath: /ssh
                  readOnly: true
                - mountPath: /scripts
                  name: s3-scripts
          volumes:
            - name: backup-ssh-key
              secret:
                secretName: {{ .Values.restore.backup_server_secret }}
                defaultMode: 0400
                items:
                  - key: ssh_key
                    path: ssh_key
            - name: s3-scripts
              configMap:
                name: s3-scripts
                defaultMode: 0755
{{- end }}
{{- if eq .Values.rustfs.restore.type "differential" }}
---
apiVersion: batch/v1
{{ if .Values.restore.cronjob }}
kind: CronJob
{{- else }}
kind: Job
{{- end }}
metadata:
  name: rustfs-restore
  labels:
    app: backup-runner
    job-type: restore
spec:
  {{ if .Values.restore.cronjob }}
  schedule: {{ default .Values.restore.schedule .Values.rustfs.restore.schedule }}
  {{- if .Values.timezone }}
  timeZone: {{ .Values.timezone }}
  {{- end }}
  jobTemplate:
    spec:
  {{- end }}
      template:
        metadata:
          labels:
            app: backup-runner
            job-type: restore
        spec:
          {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.rustfs) | nindent 10 }}
          serviceAccountName: backup-runner
          containers:
            - name: runner
              image: {{ include "opencrvs.imageReference" .Values.utilities }}
              command:
                - /bin/sh
                - -c
                - |
                  kubectl exec rustfs-0 -c rsync -- \
                    /bin/sh -c "rsync -avz --chown={{ .Values.rustfs.run_as_id }}:{{ .Values.rustfs.run_as_id }} -e 'ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no' \$BACKUP_USER@\$BACKUP_HOST:\$BACKUP_REMOTE_DIR/minio/ /data"
          restartPolicy: OnFailure
{{- end }}
{{- end }}

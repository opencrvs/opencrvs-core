{{ if .Values.seaweedfs.enabled }}
{{- $storageType := default .Values.storage_type .Values.seaweedfs.storage_type | default "pvc" }}
{{- if eq $storageType "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: seaweedfs
  name: seaweedfs
spec:
  {{- if .Values.seaweedfs.pvc.storage_class }}
  storageClassName: {{ .Values.seaweedfs.pvc.storage_class | quote }}
  {{- end }}
  accessModes:
    - {{ .Values.seaweedfs.pvc.access_mode }}
  resources:
    requests:
      storage: {{ .Values.seaweedfs.pvc.storage_size }}
{{- end }}
---
{{- /*
The public hostnames are those of MinIO, so that switching the store needs no
DNS or certificate change, and the services chart derives S3_PUBLIC_URL from the
same name.
*/}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweedfs-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- end }}
  {{- if or .Values.ingress.tls_resolver (not .Values.ingress.ssl_enabled) }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`{{ include "render-external-subdomain" (dict "service_name" "minio" "Values" .Values) }}`)'
    kind: Rule
    services:
    - name: seaweedfs
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.seaweedfs.port }}
    {{- if .Values.ingress.application_allowlist }}
    middlewares:
      - name: application-ip-allowlist
    {{- end }}
  {{- if .Values.seaweedfs.console.enabled }}
  - match: 'Host(`{{ include "render-external-subdomain" (dict "service_name" "minio-console" "Values" .Values) }}`)'
    kind: Rule
    services:
    - name: seaweedfs
      namespace: {{ .Release.Namespace }}
      port: 3536
    {{- if .Values.ingress.admin_console_allowlist }}
    middlewares:
      - name: admin-console-ip-allowlist
    {{- end }}
  {{- end }}
  {{- if .Values.ingress.tls_resolver }}
  tls:
    certResolver: {{ .Values.ingress.tls_resolver }}
  {{- else if .Values.ingress.tls_secret_name }}
  tls:
    secretName: {{ .Values.ingress.tls_secret_name }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: seaweedfs
  name: seaweedfs
spec:
  {{- $service_type := default .Values.service_type .Values.seaweedfs.service_type }}
  type: {{ $service_type }}
  {{- if eq $service_type "ClusterIP" }}
  clusterIP: None
  {{- end }}
  ports:
    - name: s3
      port: {{ .Values.seaweedfs.port }}
      targetPort: {{ .Values.seaweedfs.port }}
      {{- if .Values.seaweedfs.node_port }}
      nodePort: {{ .Values.seaweedfs.node_port }}
      {{- end }}
    {{- if .Values.seaweedfs.console.enabled }}
    - name: console
      port: 3536
      targetPort: 3536
      {{- if .Values.seaweedfs.node_port_console }}
      nodePort: {{ .Values.seaweedfs.node_port_console }}
      {{- end }}
    {{- end }}
  selector:
    app: seaweedfs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: seaweedfs
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  serviceName: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.seaweedfs) | nindent 6 }}
    {{- if .Values.priority_class.enabled }}
      priorityClassName: {{ .Values.priority_class.name }}
    {{- end }}
    {{- $node_selector := default .Values.node_selector .Values.seaweedfs.node_selector }}
    {{- if $node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := $node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
    {{- end }}
      containers:
        # The master, the volume server, the filer and the S3 gateway run as one
        # process. Only the S3 gateway listens beyond the pod: the others bind to
        # the loopback interface, because the filer would serve every object
        # without checking the S3 credentials. The Iceberg and Lance catalogs
        # of the S3 gateway are not used, so their listeners are switched off.
        - name: seaweedfs
          image: {{ include "opencrvs.imageReference" .Values.seaweedfs }}
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -volume.max=0
            - -master.volumeSizeLimitMB={{ .Values.seaweedfs.volume_size_limit_mb }}
            - -filer.exposeDirectoryData=false
            - -s3
            - -s3.port={{ .Values.seaweedfs.port }}
            - -s3.ip.bind=0.0.0.0
            - -s3.port.iceberg=0
            - -s3.port.lance=0
          env:
            {{- include "seaweedfs.admin_credentials_env" . | nindent 12 }}
            # The identity of the store, created from these variables at startup
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ADMIN_ACCESS_KEY)
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_ADMIN_SECRET_KEY)
          {{- include "render-env-vars" (dict "service_name" "seaweedfs" "Values" .Values) }}
          ports:
            - containerPort: {{ .Values.seaweedfs.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.seaweedfs.port }}
            periodSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: seaweedfs
      {{- if .Values.seaweedfs.console.enabled }}
        # The admin console. It refuses to listen beyond the loopback interface
        # unless it is given a password, so it cannot be started without one.
        - name: console
          image: {{ include "opencrvs.imageReference" .Values.seaweedfs }}
          args:
            - admin
            - -master=127.0.0.1:9333
            - -port=3536
            - -dataDir=/console-data
            - -adminUser=$(S3_ADMIN_ACCESS_KEY)
            - -adminPassword=$(S3_ADMIN_SECRET_KEY)
          env:
            {{- include "seaweedfs.admin_credentials_env" . | nindent 12 }}
          ports:
            - containerPort: 3536
              protocol: TCP
          volumeMounts:
            - mountPath: /console-data
              name: console-data
      {{- end }}
      restartPolicy: Always
      volumes:
        - name: seaweedfs
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: seaweedfs
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.seaweedfs.host_data_path }}
            type: DirectoryOrCreate
      {{- end }}
      {{- if .Values.seaweedfs.console.enabled }}
        - name: console-data
          emptyDir: {}
      {{- end }}

{{ include "network-policy-rules" (dict "service_name" "seaweedfs"  "Values" .Values) }}
{{- end }}

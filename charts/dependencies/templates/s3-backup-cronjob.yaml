{{- $store := include "s3.store" . }}
{{- $s3 := index .Values (include "s3.store" .) }}
{{ if and (index .Values $store).enabled (eq (include "s3.backup_enabled" .) "true") }}
{{- if eq $s3.backup.type "dump" }}
---
apiVersion: batch/v1
{{ if .Values.backup.cronjob }}
kind: CronJob
{{- else }}
kind: Job
{{- end }}
metadata:
  name: {{ $store }}-backup
  labels:
    app: {{ $store }}
    job-type: backup
spec:
  {{ if .Values.backup.cronjob }}
  schedule: {{ $s3.backup_schedule | default .Values.backup.schedule }}
  {{- if .Values.timezone }}
  timeZone: {{ .Values.timezone }}
  {{- end }}
  jobTemplate:
    spec:
  {{- end }}
      template:
        metadata:
          labels:
            app: {{ $store }}
            job-type: backup
        spec:
          {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" (index .Values $store)) | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: backup
              command: ["/scripts/backup.sh"]
              image: {{ include "opencrvs.imageReference" .Values.utilities }}
              env:
                - name: S3_ADMIN_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-opencrvs-users
                      key: S3_ADMIN_ACCESS_KEY
                - name: S3_ADMIN_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-opencrvs-users
                      key: S3_ADMIN_SECRET_KEY
                - name: S3_ENDPOINT
                  value: {{ include "s3.endpoint" . }}
                - name: ENCRYPT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_encryption_secret }}
                      key: backup_encryption_key
                - name: BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.backup_server_secret }}
                      key: user
                - name: BACKUP_HOST
                  value: {{ default .Values.backup.host $s3.backup.host }}
                - name: BACKUP_REMOTE_DIR
                  value: "{{ $s3.backup_server_dir | default .Values.backup.backup_server_dir }}"
              {{- include "render-env-vars" (dict "service_name" "backup" "Values" .Values) | nindent 4 }}
              volumeMounts:
                - name: backup-ssh-key
                  mountPath: /ssh
                  readOnly: true
                - mountPath: /scripts
                  name: s3-scripts
          volumes:
            - name: backup-ssh-key
              secret:
                secretName: {{ .Values.backup.backup_server_secret }}
                defaultMode: 0400
                items:
                  - key: ssh_key
                    path: ssh_key
            - name: s3-scripts
              configMap:
                name: s3-scripts
                defaultMode: 0755
{{- end }}
{{- if eq $s3.backup.type "differential" }}
---
apiVersion: batch/v1
{{ if .Values.backup.cronjob }}
kind: CronJob
{{- else }}
kind: Job
{{- end }}
metadata:
  name: {{ $store }}-backup
  labels:
    app: backup-runner
    job-type: backup
spec:
  {{ if .Values.backup.cronjob }}
  schedule: {{ default .Values.backup.schedule $s3.backup.schedule }}
  {{- if .Values.timezone }}
  timeZone: {{ .Values.timezone }}
  {{- end }}
  jobTemplate:
    spec:
  {{- end }}
      template:
        metadata:
          labels:
            app: backup-runner
            job-type: backup
        spec:
          {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" (index .Values $store)) | nindent 10 }}
          serviceAccountName: backup-runner
          containers:
            - name: runner
              image: {{ include "opencrvs.imageReference" .Values.utilities }}
              command:
                - /bin/sh
                - -c
                - |
                  kubectl exec {{ $store }}-0 -c rsync -- \
                    /bin/sh -c "rsync -avz --exclude='.minio.sys/config/iam/' --exclude='.rustfs.sys/config/iam/' -e 'ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no' /data/ \$BACKUP_USER@\$BACKUP_HOST:\$BACKUP_REMOTE_DIR/minio"
          restartPolicy: OnFailure
{{- end }}
{{- end }}

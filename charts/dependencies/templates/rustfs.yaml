{{ if .Values.rustfs.enabled }}
{{- $id := .Values.rustfs.run_as_id }}
{{- $storageType := default .Values.storage_type .Values.rustfs.storage_type | default "pvc" }}
{{- $use_rsync := eq (include "rustfs.use_rsync" .) "true" }}
{{- /* Restore enabled -> the rsync sidecar uses the values and the key for restore, backup otherwise */}}
{{- $mode := ternary "restore" "backup" (eq (include "rustfs.restore_enabled" .) "true") }}
{{- $global := index .Values $mode }}
{{- $local := index .Values.rustfs $mode }}
{{- if eq $storageType "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: rustfs
  name: {{ .Values.rustfs.pvc.name }}
spec:
  {{- if .Values.rustfs.pvc.storage_class }}
  storageClassName: {{ .Values.rustfs.pvc.storage_class | quote }}
  {{- end }}
  accessModes:
    - {{ .Values.rustfs.pvc.access_mode }}
  resources:
    requests:
      storage: {{ .Values.rustfs.pvc.storage_size }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- end }}
  {{- if or .Values.ingress.tls_resolver (not .Values.ingress.ssl_enabled) }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`{{ include "render-external-subdomain" (dict "service_name" "rustfs" "Values" .Values) }}`)'
    kind: Rule
    services:
    - name: rustfs
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.rustfs.port }}
    {{- if .Values.ingress.application_allowlist }}
    middlewares:
      - name: application-ip-allowlist
    {{- end }}
  {{- if .Values.rustfs.console.enabled }}
  - match: 'Host(`{{ include "render-external-subdomain" (dict "service_name" "rustfs-console" "Values" .Values) }}`)'
    kind: Rule
    services:
    - name: rustfs
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.rustfs.console.port }}
    {{- if .Values.ingress.admin_console_allowlist }}
    middlewares:
      - name: admin-console-ip-allowlist
    {{- end }}
  {{- end }}
  {{- if .Values.ingress.tls_resolver }}
  tls:
    certResolver: {{ .Values.ingress.tls_resolver }}
  {{- else if .Values.ingress.tls_secret_name }}
  tls:
    secretName: {{ .Values.ingress.tls_secret_name }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rustfs
  name: rustfs
spec:
  {{- $service_type := default .Values.service_type .Values.rustfs.service_type }}
  type: {{ $service_type }}
  {{- if eq $service_type "ClusterIP" }}
  clusterIP: None
  {{- end }}
  ports:
    - name: s3
      port: {{ .Values.rustfs.port }}
      targetPort: {{ .Values.rustfs.port }}
      {{- if .Values.rustfs.node_port }}
      nodePort: {{ .Values.rustfs.node_port }}
      {{- end }}
    {{- if .Values.rustfs.console.enabled }}
    - name: console
      port: {{ .Values.rustfs.console.port }}
      targetPort: {{ .Values.rustfs.console.port }}
      {{- if .Values.rustfs.node_port_console }}
      nodePort: {{ .Values.rustfs.node_port_console }}
      {{- end }}
    {{- end }}
  selector:
    app: rustfs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: rustfs
  name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  serviceName: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.rustfs) | nindent 6 }}
    {{- if .Values.priority_class.enabled }}
      priorityClassName: {{ .Values.priority_class.name }}
    {{- end }}
    {{- $node_selector := default .Values.node_selector .Values.rustfs.node_selector }}
    {{- if $node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := $node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
    {{- end }}
      securityContext:
        runAsUser: {{ $id }}
        runAsGroup: {{ $id }}
        fsGroup: {{ $id }}
        fsGroupChangePolicy: OnRootMismatch
    {{- if eq $storageType "host_path" }}
      initContainers:
        - name: fix-permissions
          image: {{ include "opencrvs.imageReference" .Values.rustfs }}
          command:
            - sh
            - -c
            - '[ "$(stat -c %u /data)" = "{{ $id }}" ] || { find /data -mindepth 1 -exec chown {{ $id }}:{{ $id }} {} + && chown {{ $id }}:{{ $id }} /data; }'
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /data
              name: rustfs
    {{- end }}
      containers:
        - name: rustfs
          image: {{ include "opencrvs.imageReference" .Values.rustfs }}
          # No args: the image serves /data, which is its RUSTFS_VOLUMES
          env:
            - name: RUSTFS_ADDRESS
              value: {{ printf ":%v" .Values.rustfs.port | quote }}
            - name: RUSTFS_CONSOLE_ENABLE
              value: {{ .Values.rustfs.console.enabled | quote }}
            {{- if .Values.rustfs.console.enabled }}
            - name: RUSTFS_CONSOLE_ADDRESS
              value: {{ printf ":%v" .Values.rustfs.console.port | quote }}
            {{- end }}
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: {{ .Values.rustfs.cors_allowed_origins | quote }}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-opencrvs-users
                  key: S3_ADMIN_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-opencrvs-users
                  key: S3_ADMIN_SECRET_KEY
          {{- include "render-env-vars" (dict "service_name" "rustfs" "Values" .Values) }}
          ports:
            - containerPort: {{ .Values.rustfs.port }}
              protocol: TCP
          {{- if .Values.rustfs.console.enabled }}
            - containerPort: {{ .Values.rustfs.console.port }}
              protocol: TCP
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.rustfs.port }}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /data
              name: rustfs
      {{- if $use_rsync }}
        # The sidecar that the differential backup and restore jobs run rsync in with kubectl exec.
        # It runs as root, where the pod runs as another user. The kubelet adds the group of the pod
        # (fsGroup) to the mode of the files of a secret, so the key is copied before ssh sees it:
        # ssh refuses a private key that the group can read.
        - image: {{ include "opencrvs.imageReference" .Values.utilities }}
          name: rsync
          command:
            - sh
            - -c
            - mkdir -p /root/.ssh && cp /ssh/ssh_key /root/.ssh/id_rsa && chmod 600 /root/.ssh/id_rsa && exec sleep infinity
          securityContext:
            runAsUser: 0
          env:
            - name: BACKUP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ default $global.backup_server_secret $local.server_secret }}
                  key: user
            - name: BACKUP_HOST
              value: {{ default $global.host $local.host }}
            - name: BACKUP_REMOTE_DIR
              value: {{ default $global.backup_server_dir $local.server_dir }}
          volumeMounts:
            - mountPath: /data
              name: rustfs
            - name: backup-ssh-key
              mountPath: /ssh
              readOnly: true
      {{- end }}
      restartPolicy: Always
      volumes:
        - name: rustfs
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.rustfs.pvc.name }}
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.rustfs.host_data_path }}
            type: DirectoryOrCreate
      {{- end }}
      {{- if $use_rsync }}
        - name: backup-ssh-key
          secret:
            secretName: {{ default $global.backup_server_secret $local.server_secret }}
            defaultMode: 0400
            items:
              - key: ssh_key
                path: ssh_key
      {{- end }}

{{ include "network-policy-rules" (dict "service_name" "rustfs"  "Values" .Values) }}
{{- end }}

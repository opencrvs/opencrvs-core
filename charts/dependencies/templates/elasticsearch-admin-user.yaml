{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.elasticsearch.admin_user_secret_name }}
{{- if not $secret }}
  {{- $password := .Values.elasticsearch.admin_password | default "" }}
  {{- if .Values.elasticsearch.use_default_credentials }}
    {{- $password = $password | default "elasticadmin" }}
  {{- else }}
    {{- $password = $password | default (randAlphaNum 32) }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.elasticsearch.admin_user_secret_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/resource-policy": keep
type: Opaque
data:
  ELASTIC_PASSWORD: {{ $password | b64enc }}
{{- end }}

{{ if .Values.minio.enabled }}
{{- $storageType := default .Values.storage_type .Values.minio.storage_type | default "pvc" }}
{{- if eq $storageType "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: minio
  name: minio
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- if .Values.minio.pvc.storage_class }}
  storageClassName: {{ .Values.minio.pvc.storage_class | quote }}
  {{- end }}
  accessModes:
    - {{ .Values.minio.pvc.access_mode }}
  resources:
    requests:
      storage: {{ .Values.minio.pvc.storage_size }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-route
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- end }}
  {{- if or .Values.ingress.tls_resolver (not .Values.ingress.ssl_enabled) }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`{{ include "render-external-subdomain" (dict "service_name" "minio" "Values" .Values) }}`)'
    kind: Rule
    services:
    - name: minio
      namespace: {{ .Release.Namespace }}
      port: 3535
    {{- if .Values.ingress.application_allowlist }}
    middlewares:
      - name: application-ip-allowlist
    {{- end }}
  - match: 'Host(`{{ include "render-external-subdomain" (dict "service_name" "minio-console" "Values" .Values) }}`)'
    kind: Rule
    services:
    - name: minio
      namespace: {{ .Release.Namespace }}
      port: 3536
    {{- if .Values.ingress.admin_console_allowlist }}
    middlewares:
      - name: admin-console-ip-allowlist
    {{- end }}
  {{- if .Values.ingress.tls_resolver }}
  tls:
    certResolver: {{ .Values.ingress.tls_resolver }}
  {{- else if .Values.ingress.tls_secret_name }}
  tls:
    secretName: {{ .Values.ingress.tls_secret_name }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: minio
  name: minio
spec:
  {{- $service_type := default .Values.service_type .Values.minio.service_type }}
  type: {{ $service_type }}
  {{- if eq $service_type "ClusterIP" }}
  clusterIP: None
  {{- end }}
  ports:
    - name: '3535'
      port: 3535
      targetPort: 3535
      {{- if .Values.minio.node_port }}
      nodePort: {{ .Values.minio.node_port }}
      {{- end }}
    - name: '3536'
      port: 3536
      targetPort: 3536
      {{- if .Values.minio.node_port_console }}
      nodePort: {{ .Values.minio.node_port_console }}
      {{- end }}
  selector:
    app: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: minio
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  serviceName: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.minio) | nindent 6 }}
    {{- if .Values.priority_class.enabled }}
      priorityClassName: {{ .Values.priority_class.name }}
    {{- end }}
    {{- $node_selector := default .Values.node_selector .Values.minio.node_selector }}
    {{- if $node_selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
            {{- range $k, $v := $node_selector }}
              - key: {{ $k }}
                operator: In
                values:
                - {{ $v }}
            {{- end }}
    {{- end }}
      containers:
        - args:
            - server
            - --address
            - :3535
            - --console-address
            - :3536
            - /data
          image: {{ include "opencrvs.imageReference" .Values.minio }}
          name: minio
          env:
            - name: MINIO_BROWSER_REDIRECT_URL
              value: {{ include "render-external-url" (dict "service_name" "minio-console" "Values" .Values) }}
            - name: MINIO_DOMAIN
              value: {{ include "render-external-url" (dict "service_name" "minio" "Values" .Values) }}
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: '*'
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: s3-opencrvs-users
                  key: S3_ADMIN_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: s3-opencrvs-users
                  key: S3_ADMIN_SECRET_KEY
          {{- include "render-env-vars" (dict "service_name" "minio" "Values" .Values) }}
          ports:
            - containerPort: 3535
              protocol: TCP
            - containerPort: 3536
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: minio
      {{- if and (eq (include "s3.use_rsync" .) "true") (eq (include "s3.store" .) "minio") }}
        {{- include "s3.rsync_container" . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      volumes:
        - name: minio
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: minio
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.minio.host_data_path }}
            type: DirectoryOrCreate
      {{- end }}
      {{- if and (eq (include "s3.use_rsync" .) "true") (eq (include "s3.store" .) "minio") }}
        {{- include "s3.rsync_volume" . | nindent 8 }}
      {{- end }}

{{ include "network-policy-rules" (dict "service_name" "minio"  "Values" .Values) }}
{{- end }}

{{/* Prevent secret mutation between helm upgrades */}}
{{- $secret_name := "s3-opencrvs-users" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secret_name }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "minio-opencrvs-users" }}
{{- if not (or $secret $legacy) }}
{{- /*
The credentials are the values of the store that is deployed: those of rustfs when
RustFS is enabled and MinIO is not, those of minio otherwise, also when both are
enabled. Each store has the default pair of its own.
*/}}
{{- $backend := "minio" }}
{{- $default_credential := "minioadmin" }}
{{- if and .Values.rustfs.enabled (not .Values.minio.enabled) }}
{{- $backend = "rustfs" }}
{{- $default_credential = "rustfsadmin" }}
{{- end }}
{{- $store := index .Values $backend }}
{{- $username := $store.admin_username | default "" }}
{{- $password := $store.admin_password | default "" }}
{{- if and (not $username) (not $password) }}
{{- if $store.use_default_credentials }}
{{- $username = $default_credential }}
{{- $password = $default_credential }}
{{- else }}
{{- $username = randAlphaNum 16 }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- if or (not $username) (not $password) }}
{{- fail (printf "%s.admin_username and %s.admin_password must be set together" $backend $backend) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret_name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  S3_ACCESS_KEY: {{ $username | b64enc }}
  S3_ADMIN_ACCESS_KEY: {{ $username | b64enc }}
  S3_ADMIN_SECRET_KEY: {{ $password | b64enc }}
  S3_SECRET_KEY: {{ $password | b64enc }}
{{- end }}

{{/* Prevent secret mutation between helm upgrades */}}
{{- $secret_name := "s3-opencrvs-users" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secret_name }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "minio-opencrvs-users" }}
{{- if not (or $secret $legacy) }}
{{- $username := .Values.minio.admin_username | default "" }}
{{- $password := .Values.minio.admin_password | default "" }}
{{- if and (not $username) (not $password) }}
{{- if .Values.minio.use_default_credentials }}
{{- $username = "minioadmin" }}
{{- $password = "minioadmin" }}
{{- else }}
{{- $username = randAlphaNum 16 }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- if or (not $username) (not $password) }}
{{- fail "minio.admin_username and minio.admin_password must be set together" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret_name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  S3_ACCESS_KEY: {{ $username | b64enc }}
  S3_ADMIN_ACCESS_KEY: {{ $username | b64enc }}
  S3_ADMIN_SECRET_KEY: {{ $password | b64enc }}
  S3_SECRET_KEY: {{ $password | b64enc }}
{{- end }}

{{- $generated_credentials := or (not .Values.minio.use_default_credentials) (and .Values.seaweedfs.enabled (not .Values.seaweedfs.use_default_credentials)) }}
{{- if $generated_credentials }}
{{/* Prevent secret mutation between helm upgrades */}}
{{- $secret_name := "s3-opencrvs-users" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secret_name }}
{{- if not $secret }}
{{/*
Before the object store was made replaceable, the secret was called
minio-opencrvs-users. Adopt its credentials, so an upgrade does not rotate them.
Each new key may still be stored under its former MINIO_* name.
*/}}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "minio-opencrvs-users" }}
{{- $legacy_data := dict }}
{{- if $legacy }}
{{- $legacy_data = $legacy.data | default dict }}
{{- end }}
{{- $adopted := dict }}
{{- range $key, $former_key := dict "S3_ACCESS_KEY" "MINIO_ACCESS_KEY" "S3_SECRET_KEY" "MINIO_SECRET_KEY" "S3_ADMIN_ACCESS_KEY" "MINIO_ROOT_USER" "S3_ADMIN_SECRET_KEY" "MINIO_ROOT_PASSWORD" }}
{{- $value := get $legacy_data $key | default (get $legacy_data $former_key) }}
{{- if $value }}
{{- $_ := set $adopted $key $value }}
{{- end }}
{{- end }}
{{- if ne (len $adopted) 4 }}
{{- $username := randAlphaNum 16 | b64enc }}
{{- $password := randAlphaNum 32 | b64enc }}
{{- $adopted = dict "S3_ACCESS_KEY" $username "S3_ADMIN_ACCESS_KEY" $username "S3_ADMIN_SECRET_KEY" $password "S3_SECRET_KEY" $password }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret_name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
type: Opaque
data:
  {{- range $key, $value := $adopted }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}
{{- end }}

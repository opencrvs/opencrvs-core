{{- $storageType := default .Values.storage_type .Values.postgres.storage_type | default "pvc" }}
{{- if and
      (eq .Values.postgres.restore.type "differential")
      (eq (include "postgres.restore_enabled" .) "true")
}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-restore-runner-manifest
data:
  postgres-restore-runner.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: postgres-restore-runner
      labels:
        app: postgres-restore-runner
    spec:
      {{- include "opencrvs.imagePullSecrets" (dict "root" . "service" .Values.postgres) | nindent 6 }}
      containers:
      - name: restore-runner
        image: {{ include "opencrvs.imageReference" .Values.postgres }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            # pgbackrest runs as postgres user, secret volume files are owned by root.
            # Copy the key before installing pgbackrest: the restore job starts
            # as soon as `pgbackrest version` succeeds.
            mkdir -p /var/lib/postgresql/.ssh
            cp /root/.ssh/id_rsa /var/lib/postgresql/.ssh/id_rsa
            chown -R postgres:postgres /var/lib/postgresql/.ssh
            chmod 700 /var/lib/postgresql/.ssh
            chmod 400 /var/lib/postgresql/.ssh/id_rsa
            apt update -q
            apt upgrade -y -q
            apt install -y -q ca-certificates
            pgdg_codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            pgdg_signed_by=$(grep -rh 'apt\.postgresql\.org' /etc/apt/sources.list.d/ | grep -oE 'signed-by=[^] ]+' | head -n 1)
            echo "deb [${pgdg_signed_by}] https://apt-archive.postgresql.org/pub/repos/apt ${pgdg_codename}-pgdg-archive main" > /etc/apt/sources.list.d/pgdg-archive.list
            missing=""
            for utility in pgbackrest ssh; do
              command -v "$utility" >/dev/null 2>&1 || missing="$missing $utility"
            done
            if [ -n "$missing" ] && { ! apt update || ! apt install -y pgbackrest={{ .Values.postgres.pgbackrest_version }}* openssh-client; }; then
              echo "[ERROR] Missing utilities:$missing" >&2
              echo "[ERROR] Automatic installation failed. Ensure the container can access its package repositories, or include the required packages in the base image for air-gapped deployments." >&2
              exit 1
            fi
            cat > /etc/ssh/ssh_config.d/backup.conf <<'EOF'
            StrictHostKeyChecking no
            EOF
            sleep infinity
        volumeMounts:
          - name: postgres
            mountPath: /var/lib/postgresql/data
          - name: pgbackrest-config
            mountPath: /etc/pgbackrest
          - name: pgbackrest-ssh
            mountPath: /root
            readOnly: true
        env:
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgres.admin_user_secret_name }}
                key: POSTGRES_USER
          - name: PGBACKREST_CONFIG
            value: /etc/pgbackrest/pgbackrest.conf
          - name: PGBACKREST_REPO1_PATH
            value: "{{ default .Values.postgres.restore.server_dir .Values.restore.backup_server_dir }}/postgres"
          - name: PGBACKREST_STANZA
            value: {{ .Values.postgres.backup.stanza }}
          - name: PGBACKREST_REPO1_HOST_USER
            valueFrom:
              secretKeyRef:
                name: {{ default .Values.postgres.restore.server_secret .Values.restore.backup_server_secret }}
                key: user
          - name: PGBACKREST_REPO1_HOST
            value: {{ default .Values.restore.host .Values.postgres.restore.host }}
          - name: PGBACKREST_REPO1_TYPE
            value: posix
          - name: PGBACKREST_REPO1_CIPHER_TYPE
            value: aes-256-cbc
          - name: PGBACKREST_REPO1_CIPHER_PASS
            valueFrom:
              secretKeyRef:
                name: {{ default .Values.postgres.restore.encryption_secret .Values.restore.backup_encryption_secret }}
                key: backup_encryption_key
      restartPolicy: Never
      volumes:
        - name: postgres
      {{- if eq $storageType "pvc" }}
          persistentVolumeClaim:
            claimName: postgres
      {{- else if eq $storageType "host_path" }}
          hostPath:
            path: {{ .Values.postgres.host_data_path | default "/data/postgres" }}
            type: DirectoryOrCreate
      {{- end }}
        - name: pgbackrest-config
          configMap:
            name: postgres-pgbackrest-config
        - name: pgbackrest-ssh
          secret:
            secretName: {{ default .Values.postgres.restore.server_secret .Values.restore.backup_server_secret }}
            defaultMode: 0400
            items:
              - key: ssh_key
                path: .ssh/id_rsa

{{ include "network-policy-rules" (dict "service_name" "postgres-restore-runner" "Values" .Values) }}
{{- end }}

# Notifies about failed backups and restores. Covers these Kibana rules from kibana/config.ndjson:
#   - "Errors in backup logs":  logs threshold rule,    context key logs__alert__document__count
#   - "Backup job failed" and "Restore job failed": custom threshold rules, context key observability__rules__custom_threshold
#   - "Errors in restore logs": Elasticsearch query rule, context key __es-query
name: 'log-alert'
type: 'frequency'
index: 'kibana-alert-history-*'
is_enabled: true
num_events: 1
# realert is applied per query_key value, so the Kibana rules above do not
# silence each other when they fire within the same 5 minutes.
query_key: rule.name
realert:
  minutes: 5
terms_size: 50
timeframe:
  minutes: 5
timestamp_field: '@timestamp'
timestamp_type: 'iso'
use_strftime_index: false
# https://github.com/Yelp/elastalert/issues/1260
raw_count_keys: false
filter:
  - bool:
      should:
        - term:
            rule.name.keyword:
              value: 'Errors in backup logs'
        - term:
            rule.name.keyword:
              value: 'Backup job failed'
        - term:
            rule.name.keyword:
              value: 'Restore job failed'
        - term:
            rule.name.keyword:
              value: 'Errors in restore logs'
      minimum_should_match: 1

alert:
  - ${NOTIFICATION_TYPE}

email:
  - ${ALERT_EMAIL}

http_post2_url: '${HTTP_POST2_ALERT_URL}'
http_post2_payload:
  subject: '{% raw %}{{DOMAIN}}{% endraw %}: {{rule.name}} 🚨'
  html: "Reason: {% if kibana.alert.context.observability__rules__custom_threshold is defined %}{{kibana.alert.context.observability__rules__custom_threshold.reason | trim('.')}}{% elif kibana.alert.context['__es-query'] is defined %}{{kibana.alert.context['__es-query'].conditions}}{% else %}{{kibana.alert.context.logs__alert__document__count.conditions}}{% endif %}. Login to https://kibana.{% raw %}{{DOMAIN}}{% endraw %} to view the alert."
  from: '{% raw %}{{SENDER_EMAIL_ADDRESS}}{% endraw %}'
  to: '{% raw %}{{ALERT_EMAIL}}{% endraw %}'

# New way to define alerting action with more flexible templating:
alert_subject: '${DOMAIN}: {{rule.name}} 🚨'
alert_text_type: alert_text_jinja
email_format: 'html'

alert_text: |
  <p>Reason: {% if kibana.alert.context.observability__rules__custom_threshold is defined %}{{kibana.alert.context.observability__rules__custom_threshold.reason | trim('.')}}{% elif kibana.alert.context['__es-query'] is defined %}{{kibana.alert.context['__es-query'].conditions}}{% else %}{{kibana.alert.context.logs__alert__document__count.conditions}}{% endif %}.</p>

  <p>Open Kibana:</p>
  <p><a href="https://kibana.${DOMAIN}">https://kibana.${DOMAIN}</a></p>

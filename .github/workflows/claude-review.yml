name: Claude PR review

# Claude gives the PR a risk level, and then reviews it. A high-risk PR gets a
# stricter review. .github/scripts/claude-review/risk.md has the rules. Claude
# returns the level as structured output, and a later step adds the label
# "risk: <level>" to the PR. A new review with "@claude review" updates the
# label.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Converting back to draft and then ready again would re-trigger;
      # skip if a Claude review summary already exists.
      - name: Skip if already reviewed
        id: guard
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- claude-review -->")) | .id')
          if [ -n "$found" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      # Use the risk rules of the default branch. The PR branch can be older
      # than the rules, and a PR must not change the rules that classify it.
      - name: Get the risk rules
        if: steps.guard.outputs.skip != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p .claude-review
          git show FETCH_HEAD:.github/scripts/claude-review/risk.md > .claude-review/risk.md
          git show FETCH_HEAD:.github/scripts/claude-review/risk-schema.json > .claude-review/risk-schema.json
          echo "schema=$(jq -c . .claude-review/risk-schema.json)" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.guard.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request. The PR head is checked out.

            First, give the PR a risk level. Follow the rules in .claude-review/risk.md.
            Then review the PR. If the risk level is high, also do the high-risk review
            in that file.

            Review against the coding standards. Read docs/coding-standards/README.md
            and each area page that matches the changed files. Check every rule on
            those pages against the diff. When a comment reports a broken rule, name
            the page and the heading of the rule instead of writing the reason again.
            Also report bugs that the standards do not cover.

            Use mcp__github_inline_comment__create_inline_comment with confirmed: true
            for issues tied to specific lines. Use `gh pr comment` for one short
            top-level summary, and start that summary with the line <!-- claude-review -->.
            The second line of the summary is "**Risk: <level>.** <reason>". For a high
            risk, the summary also names the area that a maintainer who knows it must
            review. If earlier review comments exist (check `gh pr view --comments`),
            don't repeat points already made. Only post GitHub comments.

            Return the risk level and a one-sentence reason as the structured output.
            The workflow adds the risk label to the PR.

            Extra instructions from the requester, if any:
            ${{ github.event.comment.body }}
          # The schema is in single quotes. Do not put a "'" in risk-schema.json.
          claude_args: |
            --json-schema '${{ env.schema }}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Add the risk label
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          risk=$(jq -r '.risk // empty' <<< "$RESULT")
          reason=$(jq -r '.reason // empty' <<< "$RESULT")
          case "$risk" in
            low | medium | high) ;;
            *)
              echo "::error::The Claude review did not return a risk level"
              exit 1
              ;;
          esac

          # The labels are defined here. --force resets a label that was changed by hand.
          gh label create 'risk: low' --force --color 0e8a16 \
            --description 'Cannot change the behaviour of a deployed system'
          gh label create 'risk: medium' --force --color fbca04 \
            --description 'Changes behaviour, but matches no high-risk criterion'
          gh label create 'risk: high' --force --color b60205 \
            --description 'A maintainer who knows the area must review'

          # A new review can change the level. Remove the label of the old level.
          current=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
          for level in low medium high; do
            name="risk: $level"
            if [ "$level" != "$risk" ] && grep -qxF "$name" <<< "$current"; then
              encoded=$(jq -rn --arg name "$name" '$name | @uri')
              gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$encoded" > /dev/null
            fi
          done
          gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            -f "labels[]=risk: $risk" > /dev/null

          echo "**Risk: $risk.** $reason" >> "$GITHUB_STEP_SUMMARY"

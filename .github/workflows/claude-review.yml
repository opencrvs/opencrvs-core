name: Claude PR review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Converting back to draft and then ready again would re-trigger;
      # skip if a Claude review summary already exists.
      - name: Skip if already reviewed
        id: guard
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- claude-review -->")) | .id')
          if [ -n "$found" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request. The PR head is checked out.
            Use mcp__github_inline_comment__create_inline_comment with confirmed: true
            for issues tied to specific lines. Use `gh pr comment` for one short
            top-level summary, and start that summary with the line <!-- claude-review -->.
            If earlier review comments exist (check `gh pr view --comments`),
            don't repeat points already made. Only post GitHub comments.

            Extra instructions from the requester, if any:
            ${{ github.event.comment.body }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

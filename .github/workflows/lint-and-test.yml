name: Lint and run unit tests

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  setup:
    name: Setup tests
    permissions:
      contents: read
      pull-requests: write
      # nx-set-shas queries the API for the last successful workflow run
      actions: read
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # nx affected needs history to resolve the base SHA
          fetch-depth: 0

      - uses: mskelton/changelog-reminder-action@v3
        # forked repos cannot access secrets.GITHUB_TOKEN which causes this step
        # to fail
        continue-on-error: true
        if: github.event_name == 'pull_request'
        with:
          message: >
            Oops! Looks like you forgot to update the changelog.
            When updating CHANGELOG.md, please consider the following:
              - Changelog is read by country implementors who might not always be familiar with all technical details of OpenCRVS. Keep language high-level, user friendly and avoid technical references to internals.
              - Answer "What's new?", "Why was the change made?" and "Why should I care?" for each change.
              - If it's a breaking change, include a migration guide answering "What do I need to do to upgrade?".

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Nx needs node_modules to compute the project graph; lifecycle
      # scripts are irrelevant for that.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets NX_BASE/NX_HEAD. On PRs: the PR base. On develop pushes: the
      # SHA of the last successful run of this workflow, so commits whose
      # run failed are re-included in the next run's affected set.
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      # create-countryconfig lives under packages/toolkit/ and has no
      # lint/test targets — it never ran in this workflow's matrix.
      #
      # Changes to this workflow (and the scripts it drives) are invisible
      # to `nx affected`, so a CI-only PR would yield an empty matrix and
      # skip every job below — merging CI changes without ever running
      # them. Select every project instead when that happens. Dependency
      # builds still come from the nx cache; what needs exercising is the
      # workflow's own steps, not a cold rebuild.
      - name: Get list of affected packages
        id: set-matrix
        run: |
          if git diff --name-only "$NX_BASE" "$NX_HEAD" \
            | grep -qE '^\.github/(workflows/lint-and-test\.yml|scripts/changed-files-affect-storybook\.mjs)$'; then
            echo "CI configuration changed — selecting every project"
            PROJECTS=$(pnpm exec nx show projects --exclude @opencrvs/create-countryconfig --json)
          else
            PROJECTS=$(pnpm exec nx show projects --affected --exclude @opencrvs/create-countryconfig --json)
          fi
          PACKAGES=$(echo "$PROJECTS" | jq -c 'map("packages/" + ltrimstr("@opencrvs/"))')
          echo "Selected packages: $PACKAGES"
          echo "matrix=${PACKAGES}" >> $GITHUB_OUTPUT

      - name: Prepare coverage explanation
        run: |
          echo "COVERAGE_EXPLANATION<<EOF" >> $GITHUB_ENV
          echo "_ℹ️ Coverage metrics explained:_" >> $GITHUB_ENV
          echo "• *Statements* — Executed code statements (basic logic lines)" >> $GITHUB_ENV
          echo "• *Branches* — Tested decision paths (if/else, switch, ternaries)" >> $GITHUB_ENV
          echo "• *Functions* — Functions invoked during tests" >> $GITHUB_ENV
          echo "• *Lines* — Source lines executed" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post coverage explanation to PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: test-coverage-explanation
          message: ${{ env.COVERAGE_EXPLANATION }}

  build-deps:
    name: Warm nx cache
    # Develop pushes only, and the ONLY writer of the nx cache. GitHub
    # cache entries cannot be rewritten, so a job that restored and then
    # saved would republish every old entry alongside its new ones and
    # grow without bound. This job deliberately does not restore: what it
    # publishes is exactly one run's fresh output, so it stays flat and
    # every other job is free to restore.
    #
    # It runs in parallel with the jobs that consume the *previous*
    # push's entry rather than blocking them, so a develop push still
    # rebuilds whatever changed in that push.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared dependencies
        run: |
          pnpm exec nx run-many -t build \
            -p @opencrvs/commons @opencrvs/components @opencrvs/events @opencrvs/toolkit
          pnpm exec nx run-many -t build:types -p @opencrvs/events

      # https://github.com/bojanbass/nx-aws/pull/376#issuecomment-1710695419
      # Nx stamps the machine id that produced each entry into
      # `<hash>/source` and, on a cache hit, refuses any entry whose
      # stamp is not the current machine's. Removing the source files before
      # publishing avoids that problem and allows any machine to restore.
      - name: Drop machine markers before publishing
        run: find .nx/cache -mindepth 2 -maxdepth 2 -name source -type f -delete

      - name: Save Nx cache
        uses: actions/cache/save@v4
        with:
          path: .nx/cache
          key: nx-deps-${{ github.sha }}

  test:
    name: Test
    needs: setup
    # an empty matrix is a workflow error, so guard against it
    if: needs.setup.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{fromJson(needs.setup.outputs.matrix)}}

    steps:
      - name: Checking out git repo
        uses: actions/checkout@v6
      - name: Check package.json and scripts
        id: check-scripts
        run: |
          if [ ! -f "${{ matrix.package }}/package.json" ]; then
            echo "No package.json found for ${{ matrix.package }}. Stopping pipeline."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT

            if ! grep -q "\"test\":" "${{ matrix.package }}/package.json"; then
              echo "Test not found in ${{ matrix.package }}"
              echo "skip-test=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi

            if ! grep -q "\"lint\":" "${{ matrix.package }}/package.json"; then
              echo "Lint scripts not found in ${{ matrix.package }}. Stopping pipeline."
              echo "skip-lint=true" >> $GITHUB_OUTPUT
            else
              echo "skip-lint=false" >> $GITHUB_OUTPUT
            fi

            if ! grep -q "\"test:compilation\":" "${{ matrix.package }}/package.json"; then
              echo "Typecheck script not found in ${{ matrix.package }}"
              echo "skip-compilation=true" >> $GITHUB_OUTPUT
            else
              echo "skip-compilation=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup pnpm
        if: steps.check-scripts.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        if: steps.check-scripts.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify every file has a license header
        if: steps.check-scripts.outputs.skip != 'true'
        run: npx license-check-and-add check -f license-config.json

      - name: Runs dependency installation
        if: steps.check-scripts.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Nx computation cache. Written by exactly one job (build-deps,
      # develop pushes only) so restoring here can never feed back into
      # what gets published.
      #
      # There are no explicit dependency-build steps: every target below
      # declares `dependsOn: ["^build"]` in nx.json, so nx builds each
      # package's dependencies from the project graph — cache hits when
      # their inputs match the last develop run.
      - name: Restore Nx cache
        if: steps.check-scripts.outputs.skip != 'true'
        uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-deps-${{ github.sha }}
          restore-keys: nx-deps-

      - name: Typecheck
        if: matrix.package != 'packages/client' && steps.check-scripts.outputs.skip != 'true' && steps.check-scripts.outputs.skip-compilation != 'true'
        run: pnpm exec nx run @opencrvs/$(basename ${{ matrix.package }}):test:compilation

      # TODO: should run parallel to unit tests as can take as much as unit tests
      - name: Run linting
        if: matrix.package != 'packages/client' && steps.check-scripts.outputs.skip != 'true' && steps.check-scripts.outputs.skip-lint != 'true'
        run: pnpm exec nx run @opencrvs/$(basename ${{ matrix.package }}):lint

      - name: Run Unit Test
        if: matrix.package != 'packages/client' && steps.check-scripts.outputs.skip != 'true' && steps.check-scripts.outputs.skip-test != 'true'
        run: pnpm exec nx run @opencrvs/$(basename ${{ matrix.package }}):test

      - name: Generate test coverage summary
        if: github.event_name == 'pull_request'
          && (matrix.package == 'packages/commons' || matrix.package == 'packages/events')
        run: |
          export PACKAGE_NAME=$(basename "${{ matrix.package }}")
          export COVERAGE_FILE="./${{ matrix.package }}/coverage/coverage-summary.json"

          GENERATED_REPORT=$(node -e '
            const s = require(process.env.COVERAGE_FILE).total;
            const title = `## 📊 ${process.env.PACKAGE_NAME} test coverage`;

            console.log(
              title + "\n\n" +
              "```text\n" +
              `Statements: ${s.statements.pct}%\n` +
              `Branches:   ${s.branches.pct}%\n` +
              `Functions:  ${s.functions.pct}%\n` +
              `Lines:      ${s.lines.pct}%\n` +
              `Updated at: ${new Date().toUTCString()}\n` +
              "```"
            );
          ')

          echo "PR_COMMENT_BODY<<EOF" >> $GITHUB_ENV
          echo "$GENERATED_REPORT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post test coverage to PR
        if: github.event_name == 'pull_request'
          && (matrix.package == 'packages/commons' || matrix.package == 'packages/events')
        uses: mshick/add-pr-comment@v3
        with:
          message-id: ${{ matrix.package }}-test-coverage
          message: ${{ env.PR_COMMENT_BODY }}

  countryconfig-template:
    name: Test countryconfig-template
    # Excluded from the workspace and from nx (see .nxignore), so it never
    # shows up in the matrix above and gets its own job. It installs in
    # isolation and resolves @opencrvs/toolkit from npm, so none of the
    # workspace build/cache machinery applies.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/countryconfig-template
    steps:
      - name: Checking out git repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Runs dependency installation
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      # Disabled: this package has never been typechecked in CI and does
      # not currently compile — 9 pre-existing errors in its own src/
      # (missing hapi-sentry types, hapi handler signature variance in
      # index.ts, unknown-typed catch bindings). Fix those, then flip the
      # `if` to remove the skip.
      - name: Typecheck
        if: false
        run: pnpm test:compilation

      - name: Run linting
        run: pnpm lint

      - name: Run Unit Test
        run: pnpm test

  prepare-client-tests:
    name: Prepare client tests
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'packages/client')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checking out git repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-deps-${{ github.sha }}
          restore-keys: nx-deps-

      - name: Build common package and components
        run: pnpm exec nx run-many -t build -p @opencrvs/commons @opencrvs/components

      # Build Storybook once here (with --webpack-stats-json so that
      # `preview-stats.json` is emitted). The artifact is reused by
      # `chromatic` (--storybook-build-dir) and `test-storybook`,
      # avoiding duplicate Storybook builds. `preview-stats.json` is the
      # input to the change-detection script that decides whether
      # Chromatic must run.
      - name: Build Storybook (with TurboSnap stats)
        working-directory: packages/client
        env:
          # Why are we using NODE_ENV=production? It's recommended in Chromatic docs, to ensure webpack tree-shaking is working properly
          # See: https://www.chromatic.com/docs/turbosnap/troubleshooting/#why-are-changes-not-being-detected-correctly
          NODE_ENV: production
        run: pnpm run build-storybook --webpack-stats-json

      - name: Upload filesystem as artifact
        uses: actions/upload-artifact@v7
        with:
          name: client
          include-hidden-files: true
          path: |
            .
            !**/.git
            !**/node_modules
            !.nx

  lint-client:
    name: Lint client
    needs: prepare-client-tests
    runs-on: ubuntu-26.04

    steps:
      - name: Download filesystem artifact
        uses: actions/download-artifact@v7
        with:
          name: client
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: nx-deps-${{ github.sha }}
          restore-keys: nx-deps-

      - name: Build events router types
        run: pnpm exec nx run-many -t build:types -p @opencrvs/events

      # --excludeTaskDependencies: commons/components build outputs come
      # prebuilt in the artifact, events types were built above
      - name: Compile
        run: pnpm exec nx run-many -t test:compilation -p @opencrvs/client --excludeTaskDependencies

      - name: Run linting
        run: pnpm exec nx run @opencrvs/client:lint --excludeTaskDependencies

  chromatic:
    name: Run chromatic visual tests
    needs: prepare-client-tests
    runs-on: ubuntu-26.04
    # Chromatic visual tests are disabled for now until we find a way to reduce the monthly costs
    # On average, every day we create roughly 7500 - 10000 snapshots per working day
    # Snapshots included in our plan are 35 000 per month and all exceeding snapshots are charged at $0.008 per snapshot
    if: false
    steps:
      # Fresh checkout brings .git (needed by Chromatic's TurboSnap and
      # by the change-detection `git diff` below). The artifact
      # extracted on top adds the prebuilt commons/components outputs
      # and `packages/client/storybook-static/`; source files match the
      # current commit so overwrites are no-ops.
      - name: Checkout PR branch (for git history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download filesystem artifact
        uses: actions/download-artifact@v7
        with:
          name: client
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Decide whether the diff can affect Storybook by intersecting it
      # with the module graph emitted by Storybook's
      # `--webpack-stats-json`. Backend-only changes in
      # `packages/commons` (and similar) won't appear in the graph and
      # therefore won't trigger Chromatic. The same gate applies to
      # pushes on `develop`: if no module in the Storybook bundle
      # changed, no snapshot can change and the baseline is preserved
      # by definition.
      - name: Detect storybook-affecting changes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          node .github/scripts/changed-files-affect-storybook.mjs \
            --stats packages/client/storybook-static/preview-stats.json \
            --base "$BASE_SHA"

      - name: Install dependencies
        if: steps.detect.outputs.affects == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        if: steps.detect.outputs.affects == 'true'
        working-directory: packages/client
        run: |
          pnpm run chromatic --storybook-build-dir storybook-static --diagnostics-file
          cat chromatic-diagnostics.json
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  test-storybook:
    name: Run storybook interaction tests
    needs: prepare-client-tests
    runs-on: ubuntu-26.04

    steps:
      - name: Download filesystem artifact
        uses: actions/download-artifact@v7
        with:
          name: client
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        # Playwright is required since @storybook/test-runner depends on it
        working-directory: packages/client
        run: pnpm exec playwright install --with-deps

      # `storybook-static/` is restored from the artifact built in
      # `prepare-client-tests`, so we don't need to build Storybook
      # again here.
      - name: Serve Storybook and run tests
        working-directory: packages/client
        # based on https://storybook.js.org/docs/writing-tests/test-runner#run-against-non-deployed-storybooks
        run: |
          pnpm exec concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "pnpm exec http-server storybook-static --port 6006 --silent" \
            "pnpm exec wait-on tcp:127.0.0.1:6006 && pnpm test-storybook"

  test-client:
    name: Test client
    needs: prepare-client-tests
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shards: [1, 2, 3, 4, 5]

    steps:
      - name: Download filesystem artifact
        uses: actions/download-artifact@v7
        with:
          name: client
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --excludeTaskDependencies: dependency build outputs come prebuilt
      # in the artifact; without it each shard would rebuild them (the
      # artifact excludes .nx, so nothing is cached here)
      - name: Run Unit Test
        run: pnpm exec nx run @opencrvs/client:test --excludeTaskDependencies -- --shard $(( ${{ strategy.job-index }} + 1 ))/${{ strategy.job-total }}

  lint-knip:
    name: Lint unused exports with Knip
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout the PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          path: pr

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: pr/package.json

      - name: Use Node.js from .nvmrc from base branch
        uses: actions/setup-node@v6
        with:
          node-version-file: base/.nvmrc

      - name: Install base dependencies
        run: pnpm install --ignore-scripts
        working-directory: base

      - name: Use Node.js from .nvmrc from PR branch
        uses: actions/setup-node@v6
        with:
          node-version-file: pr/.nvmrc

      - name: Install PR dependencies
        run: pnpm install --ignore-scripts
        working-directory: pr

      - name: Run knip on base branch
        id: knip_base
        run: |
          npx knip --tags=-knipignore --no-exit-code --exports --reporter=markdown | sed -E 's/ +/ /g' | sed -E 's/:[0-9]+:[0-9]+//' > knip_report.md
          TOTAL=$(grep -oP '## [A-Za-z\s]+ \(\K[0-9]+' knip_report.md | awk '{sum+=$1} END {print sum}')
          echo "Total $TOTAL issue(s) on base branch."
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
        working-directory: base

      - name: Run knip on PR branch
        id: knip_pr
        run: |
          npx knip --tags=-knipignore --no-exit-code --exports --reporter=markdown | sed -E 's/ +/ /g' | sed -E 's/:[0-9]+:[0-9]+//' > knip_report.md
          TOTAL=$(grep -oP '## [A-Za-z\s]+ \(\K[0-9]+' knip_report.md | awk '{sum+=$1} END {print sum}')
          echo "Total $TOTAL issue(s) on PR branch."
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
        working-directory: pr

      - name: Compare base and PR totals
        if: ${{ fromJSON(steps.knip_pr.outputs.total) > fromJSON(steps.knip_base.outputs.total) }}
        run: |
          echo "## ⚠️ Total issues have increased in the PR branch." >> $GITHUB_STEP_SUMMARY
          echo "Differences:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
          diff base/knip_report.md pr/knip_report.md >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          exit 1

  build-toolkit:
    name: Build toolkit
    needs: setup
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request' && contains(needs.setup.outputs.matrix, 'packages/toolkit')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: nx-deps-${{ github.sha }}
          restore-keys: nx-deps-

      # nx resolves the `^build` dependency of the build target, so
      # commons and events are built first (cache hits when warm)
      - name: Build toolkit and dependencies
        run: pnpm exec nx run @opencrvs/toolkit:build

  required-checks:
    name: Required checks
    # The single context branch protection requires from this workflow.
    #
    # Per-job names cannot be required directly any more: `nx affected`
    # makes the `test` matrix dynamic, and a matrix job that is skipped is
    # skipped before its matrix expands. Either way the check runs for
    # unselected entries are never created, so a required context named
    # after one of them waits for a status that will never be reported and
    # blocks the PR forever. A skipped *non-matrix* job does report, as
    # "success" — which is exactly why this job tolerates `skipped` below
    # and fails only on real failures.
    needs:
      - setup
      - test
      - countryconfig-template
      - prepare-client-tests
      - lint-client
      - test-storybook
      - test-client
      - lint-knip
      - build-toolkit
    # `always()`, or a skipped dependency would skip this job too and take
    # the gate down with it
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      # For a matrix dependency, `result` is the aggregate: `failure` if
      # any entry failed.
      - name: Fail unless every dependency succeeded or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled."
          exit 1

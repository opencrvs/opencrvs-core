# Opens pull requests that carry every change on a release line up into each
# newer line.
#
# The lines are every release/<major>.<minor>.x branch, then develop:
# release/1.9.x, release/2.0.x, release/2.1.x, develop. A run starts from one
# line and opens or updates one PR into every newer line, in parallel:
#   push to release/*.x   from the line that was pushed to
#   workflow_dispatch     from the line typed in, e.g. 1.9.x
#
# Each PR comes from forward-merge/<from>-into-<to> (dots stripped, e.g.
# forward-merge/19x-into-21x). The workflow merges the target into a copy of
# the older line, or new commits of the older line into an open PR's branch.
# When that merge conflicts, Claude Code resolves it and the result is pushed
# for review. If Claude leaves anything unresolved, the PR is opened from a
# plain copy of the older line with instructions to resolve it by hand.
#
# Review is requested from whoever started a manual run, or on a push from the
# authors of the PRs that the push merged (for a merged forward-merge PR, the
# authors of the feature PRs it carried).
#
# Needs the ANTHROPIC_API_KEY secret. Everything is pushed with GITHUB_TOKEN,
# so pull_request workflows (lint-and-test) do not start on these PRs until a
# person pushes to the branch.
name: Release - Forward-merge release lines

on:
  push:
    branches:
      - 'release/*.x'
  workflow_dispatch:
    inputs:
      from:
        type: string
        required: true
        description: 'Release line to start from, e.g. 1.9.x'
      dry_run:
        type: boolean
        default: false
        description: 'Only report what would be pushed and opened (Claude does not run)'

# Each job asks for what it needs.
permissions: {}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.lines.outputs.source }}
      targets: ${{ steps.lines.outputs.targets }}
      reviewers: ${{ steps.reviewers.outputs.reviewers }}
    steps:
      - name: Work out the source line and the newer lines
        id: lines
        env:
          GH_TOKEN: ${{ github.token }}
          # the line typed into a manual run, or the line that was pushed to
          REQUESTED_LINE: ${{ inputs.from || github.ref_name }}
        run: |
          # Release lines in version order: release/1.9.x release/2.0.x ...
          release_lines=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/" --paginate \
            --jq '.[].ref | ltrimstr("refs/heads/")' \
            | grep -E '^release/[0-9]+\.[0-9]+\.x$' | sort -V)

          source="release/${REQUESTED_LINE#release/}"
          if ! grep -qx "$source" <<< "$release_lines"; then
            echo "::error::'$REQUESTED_LINE' is not a release line. Release lines: $(paste -sd, <<< "$release_lines")"
            exit 1
          fi

          # every line after the source, then develop
          targets=$( (awk -v s="$source" 'found { print } $0 == s { found = 1 }' <<< "$release_lines"; echo develop) \
            | jq -R . | jq -sc .)

          echo "$source -> $targets"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Work out who to ask for review
        id: reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            reviewers="$GITHUB_ACTOR"
          else
            # The commits this push added (or just its head, for a new branch).
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              commits="$GITHUB_SHA"
            else
              commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.commits[].sha')
            fi

            # Authors of the merged PRs those commits came from. Forward-merge
            # PRs are skipped, so their feature PRs' authors are asked instead.
            reviewers=$(for commit in $commits; do
              gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" \
                --jq '.[] | select(.merged_at != null and (.head.ref | startswith("forward-merge/") | not)) | .user.login'
            done | grep -v '\[bot\]$' | sort -u | paste -sd, || true)
          fi

          echo "Reviewers: ${reviewers:-none}"
          echo "reviewers=$reviewers" >> "$GITHUB_OUTPUT"

  forward-merge:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    # one run per PR at a time, so two pushes in a row update it in order
    concurrency:
      group: forward-merge-${{ needs.plan.outputs.source }}-${{ matrix.target }}
    env:
      SOURCE_BRANCH: ${{ needs.plan.outputs.source }}
      TARGET_BRANCH: ${{ matrix.target }}
      REVIEWERS: ${{ needs.plan.outputs.reviewers }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full commit history for the merge, file contents only as needed. The
      # token is not left in .git/config; the last step authenticates git just
      # before it pushes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Start the merge from ${{ needs.plan.outputs.source }} into ${{ matrix.target }}
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # release/1.9.x -> 19x. Dots are stripped to pass the branch-name check.
          short_name() { local name="${1#release/}"; echo "${name//./}"; }
          PR_BRANCH="forward-merge/$(short_name "$SOURCE_BRANCH")-into-$(short_name "$TARGET_BRANCH")"
          echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"

          # Succeeds when $1 already contains $2.
          contains() { git merge-base --is-ancestor "$2" "$1"; }

          open_pr=$(gh pr list --head "$PR_BRANCH" --base "$TARGET_BRANCH" --state open \
            --json number --jq '.[0].number // ""')
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"

          if [ -n "$open_pr" ]; then
            # An open PR: merge the source's new commits into its branch.
            git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
            if contains HEAD "origin/$SOURCE_BRANCH"; then
              echo "#$open_pr already has everything from $SOURCE_BRANCH."
              echo "action=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            merging="$SOURCE_BRANCH"
          else
            if contains "origin/$TARGET_BRANCH" "origin/$SOURCE_BRANCH"; then
              echo "Nothing to merge from \`$SOURCE_BRANCH\` into \`$TARGET_BRANCH\`." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "action=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A branch left over from an earlier PR is only replaced if nothing
            # on it would be lost: that PR was merged, or the source has it all.
            if git rev-parse -q --verify "origin/$PR_BRANCH" > /dev/null \
              && ! contains "origin/$TARGET_BRANCH" "origin/$PR_BRANCH" \
              && ! contains "origin/$SOURCE_BRANCH" "origin/$PR_BRANCH"; then
              echo "::warning::$PR_BRANCH has commits that are in neither $TARGET_BRANCH nor $SOURCE_BRANCH, probably from a PR closed without merging. Delete or merge it, then re-run."
              echo "action=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A new PR: a copy of the source with the target merged in.
            git checkout -B "$PR_BRANCH" "origin/$SOURCE_BRANCH"
            merging="$TARGET_BRANCH"
          fi

          {
            echo "merging=$merging"
            echo "missing=$(git rev-list --count "origin/$TARGET_BRANCH..origin/$SOURCE_BRANCH")"
            echo "action=merge"
          } >> "$GITHUB_OUTPUT"

          if git merge --no-ff --no-edit -m "Merge $merging into $PR_BRANCH" "origin/$merging"; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            conflicts=$(git diff --name-only --diff-filter=U | paste -sd' ')
            echo "Conflicts: $conflicts"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the conflicts with Claude
        if: steps.merge.outputs.conflicts != '' && inputs.dry_run != true
        # if Claude fails, the next step falls back to a merge by hand
        continue-on-error: true
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action needs a token. Claude can't push or call GitHub with it:
          # its tools are limited to editing files and local, read-only or
          # staging git commands.
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git add:*),Bash(git rm:*),Bash(git checkout --ours:*),Bash(git checkout --theirs:*)"
          prompt: |
            A git merge is in progress in this repository, OpenCRVS core: `${{ steps.merge.outputs.merging }}` is being merged into `${{ steps.merge.outputs.pr_branch }}`. That branch carries the release line `${{ needs.plan.outputs.source }}` into the newer line `${{ matrix.target }}`, and will be merged into `${{ matrix.target }}` after review.

            These files have conflicts: ${{ steps.merge.outputs.conflicts }}

            Resolve every conflict. The result must keep `${{ matrix.target }}`'s code and behaviour and add the changes `${{ needs.plan.outputs.source }}` made since the two lines split:
            - Use `git log` and `git show` on both sides to understand what each change is for before choosing.
            - When a change from `${{ needs.plan.outputs.source }}` touches code that is different on `${{ matrix.target }}`, apply the same fix to `${{ matrix.target }}`'s code. If it doesn't apply there at all, leave it out.
            - package.json files: keep `${{ matrix.target }}`'s "version" values; merge the other fields.
            - CHANGELOG.md: keep `${{ matrix.target }}`'s sections and headings. Add the entries `${{ needs.plan.outputs.source }}` added under `${{ matrix.target }}`'s topmost section, leaving out entries for changes that were left out.
            - A file that one side deleted: keep it deleted unless the other side's change is still needed.

            Remove every conflict marker and `git add` (or `git rm`) each resolved file. Do not commit, push, or abort the merge.

            Finally, write a short Markdown summary to `${{ runner.temp }}/resolution.md`: one bullet per file saying what you kept and why, and a separate list of anything a reviewer should check closely.

      - name: Commit, push and open or update the PR
        if: steps.merge.outputs.action == 'merge'
        env:
          PR_BRANCH: ${{ steps.merge.outputs.pr_branch }}
          OPEN_PR: ${{ steps.merge.outputs.open_pr }}
          MERGING: ${{ steps.merge.outputs.merging }}
          MISSING: ${{ steps.merge.outputs.missing }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          RESOLUTION_FILE: ${{ runner.temp }}/resolution.md
        run: |
          set -euo pipefail

          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          # Runs a command that changes something on GitHub. A dry run only prints it.
          change() {
            if [ "$DRY_RUN" = "true" ]; then echo "[dry run] $*" >&2; else "$@"; fi
          }

          # Claude must have staged every file and left no conflict markers.
          resolved_by_claude=false
          if [ -n "$CONFLICTS" ]; then
            # shellcheck disable=SC2086 # CONFLICTS is a space-separated file list
            if [ -z "$(git diff --name-only --diff-filter=U)" ] \
              && ! git grep -qE '^(<<<<<<<|>>>>>>>)( |$)' -- $CONFLICTS 2>/dev/null; then
              git commit --no-edit
              resolved_by_claude=true
            else
              git merge --abort
              echo "::warning::The conflicts in $CONFLICTS were not resolved; they need resolving by hand."
            fi
          fi
          merged=true
          if [ -n "$CONFLICTS" ] && [ "$resolved_by_claude" = false ]; then merged=false; fi

          # shellcheck disable=SC2016,SC2086 # literal backticks; one bullet per file
          conflict_list=$(printf -- '- `%s`\n' $CONFLICTS)

          if [ "$resolved_by_claude" = true ]; then
            notes=$(cat "$RESOLUTION_FILE" 2>/dev/null || echo "Claude left no notes.")
            STATUS="Merging \`$MERGING\` conflicted in these files. **Claude Code resolved them**; check its resolution before merging.

          $conflict_list

          <details><summary>Claude's notes</summary>

          $notes
          </details>"
          elif [ "$merged" = true ]; then
            STATUS="\`$MERGING\` merged in without conflicts."
          else
            STATUS="**Merging \`$MERGING\` needs a human.** It conflicts in these files, and they were not resolved automatically:

          $conflict_list

          To resolve:
          \`\`\`sh
          git fetch origin
          git checkout -B $PR_BRANCH origin/$PR_BRANCH
          git merge origin/$MERGING
          # resolve, commit
          git push origin $PR_BRANCH
          \`\`\`"
          fi

          # Open PR: push a finished merge, and say what happened in a comment.
          if [ -n "$OPEN_PR" ]; then
            if [ "$merged" = true ]; then
              change git push origin "$PR_BRANCH"
            fi
            change gh pr comment "$OPEN_PR" --body "\`$SOURCE_BRANCH\` has new commits. $STATUS"
            if [ -n "$REVIEWERS" ]; then
              change gh pr edit "$OPEN_PR" --add-reviewer "$REVIEWERS" || true
            fi
            exit 0
          fi

          # New PR. Without a finished merge, the branch is a plain copy of the source.
          if [ "$merged" = false ]; then
            git checkout -B "$PR_BRANCH" "origin/$SOURCE_BRANCH"
          fi
          change git push --force origin "$PR_BRANCH"

          PR_BODY="Carries $MISSING commits from \`$SOURCE_BRANCH\` that \`$TARGET_BRANCH\` doesn't have yet.

          $STATUS

          Before merging:

          - [ ] The merge keeps \`$TARGET_BRANCH\`'s behaviour and applies each \`$SOURCE_BRANCH\` change where it belongs.
          - [ ] package.json files keep \`$TARGET_BRANCH\`'s version.
          - [ ] CHANGELOG.md: the \`$SOURCE_BRANCH\` entries that apply to \`$TARGET_BRANCH\` are under its own version.
          - [ ] Merge with **Create a merge commit**. Squash or rebase drops the link to \`$SOURCE_BRANCH\`, so the next run offers the same commits again.

          New commits on \`$SOURCE_BRANCH\` are merged into this branch while the PR is open.

          Opened by the forward-merge workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). CI starts once someone pushes to this branch."

          if [ "$DRY_RUN" = "true" ]; then
            printf '[dry run] PR %s -> %s, reviewers: %s\n\n%s\n' "$PR_BRANCH" "$TARGET_BRANCH" "${REVIEWERS:-none}" "$PR_BODY"
            exit 0
          fi
          pr_url=$(gh pr create --base "$TARGET_BRANCH" --head "$PR_BRANCH" \
            --title "chore: merge $SOURCE_BRANCH into $TARGET_BRANCH" --body "$PR_BODY")
          echo "Opened $pr_url" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$REVIEWERS" ]; then
            gh pr edit "$pr_url" --add-reviewer "$REVIEWERS" || true
          fi

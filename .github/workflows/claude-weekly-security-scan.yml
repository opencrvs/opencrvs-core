name: claude-weekly-security-scan

on:
  schedule:
    - cron: '0 6 * * 1'      # Mondays 06:00 UTC (only fires from the default branch)
  workflow_dispatch:
  # push:                    # uncomment while developing on a feature branch
  #   branches: [security-scan]

# Least privilege. security-events:write lets the scan READ existing code-scanning
# alerts (for carry-forward) and UPLOAD the SARIF. It never dismisses alerts.
permissions:
  contents: read
  security-events: write

concurrency:
  group: weekly-security-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@<pin-to-sha>

      - name: Set up Python
        uses: actions/setup-python@<pin-to-sha>
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install anthropic

      - name: Run Claude security scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided automatically
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          SCAN_ROOT: '.'
          MODEL: claude-opus-4-8
          OUT_DIR: scan-out
          TOOL_NAME: claude-security
        run: python .github/scripts/weekly_scan.py

      - name: Upload SARIF to the Security tab
        # Only runs if the scan step succeeded, so an aborted carry-forward
        # (which exits non-zero) never results in a thin upload.
        uses: github/codeql-action/upload-sarif@<pin-to-sha>
        with:
          sarif_file: scan-out/results.sarif
          category: claude-security-scan   # keep this stable; it scopes the analysis

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@<pin-to-sha>
        with:
          name: security-scan-report
          path: scan-out/report.md
          retention-days: 90

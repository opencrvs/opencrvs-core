# Runs the documents service's object store conformance suite against each
# verified self-hosted store, see packages/documents/README.md.

name: Documents S3 conformance

on:
  pull_request:
    paths:
      - 'packages/documents/src/s3/**'
      - 'packages/documents/test/s3-conformance/**'
      - 'packages/documents/package.json'
      - '.github/workflows/documents-s3-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    name: ${{ matrix.provider }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        provider: [minio, seaweedfs, rustfs]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start ${{ matrix.provider }}
        run: |
          docker compose -f packages/documents/test/s3-conformance/docker-compose.yml up -d ${{ matrix.provider }}
          timeout 60 sh -c 'until curl -s -o /dev/null localhost:3535; do sleep 1; done'
          # A store answers before it takes requests
          sleep 5

      # The compose file starts each store on localhost:3535 with the service's
      # default minioadmin credentials, so only the provider needs naming
      - run: pnpm --filter @opencrvs/documents test:s3-conformance
        env:
          S3_PROVIDER: ${{ matrix.provider }}

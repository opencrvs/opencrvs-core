name: Publish toolkit to NPM registry
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: >-
          Optional npm dist-tag override. Leave empty to derive the tag from npm
          state, which is the normal case. Its use is the release the derivation
          refuses to name - one that is neither the newest release overall nor
          the newest on its own line - not blessing a beta: a beta gets its own
          version from a prerelease git tag, e.g. v2.1.0-beta. Only one tag is
          ever applied per publish, so this replaces the derived tag rather than
          adding a second pointer to the same version.
        default: ''
        required: false
  push:
    tags:
      # Releases and prereleases: v2.1.0, v2.10.0, v2.1.0-beta, v2.1.0-rc.1.
      # GitHub filter patterns must match the whole ref name, so the trailing
      # "*" is what admits the prerelease suffix ("+" means "one or more of the
      # preceding character" and "." is a literal).
      #
      # Prereleases are published from a git tag because only one dist-tag can
      # be applied per publish - see the derivation step for why that is not
      # negotiable. Blessing a release candidate as `beta` would consume the
      # only tag that build can carry, so `beta` and `next` could never coexist.
      # Giving a beta a version of its own instead - 2.1.0-beta, taken from the
      # tag name - lets the beta version hold `beta` while release candidates
      # carry on holding `next`. A git tag also pins an exact commit, where an
      # rc scaffolds from a branch tip that keeps moving.
      #
      # The old bug where a prerelease tag published as `latest` is fixed in the
      # derivation rather than here: a prerelease takes its dist-tag from its
      # own prerelease identifier and cannot reach `latest`.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Check version and derive npm dist-tag
        id: check-version
        env:
          # Read through the environment rather than interpolating the input
          # straight into the script body.
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('../../package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
            if [[ "$TAG_NAME" =~ ([0-9]+)\.([0-9]+)\.([0-9]+)([-+][A-Za-z0-9.-]+)?$ ]]; then
              TOOLKIT_VERSION="${BASH_REMATCH[0]}"
              echo "✅ Using semantic version: $TOOLKIT_VERSION"
            else
              echo "❌ Tag '$TAG_NAME' is not a valid semantic version (expected something like 1.2.3 or v1.2.3)"
              exit 1
            fi
          else
            TOOLKIT_VERSION="$PACKAGE_VERSION-rc.$(git rev-parse --short=7 HEAD)"
          fi

          # --- npm dist-tag derivation ---------------------------------------
          #
          # Exactly one dist-tag is applied, via `npm publish --tag`. This is a
          # hard constraint, not a preference: `npm dist-tag add` does not accept
          # an OIDC trusted-publishing credential - only `npm publish` does
          # (npm/cli#8547, still open). This repo publishes purely over OIDC and
          # holds no NPM_TOKEN, so there is no second call available with which
          # to hang a further pointer on a version. Whatever is chosen here is
          # the only tag the published version will ever carry.
          #
          # The scheme is one rule: an unprefixed tag names the leading line, a
          # "vX.Y-" prefixed tag names a line that is no longer the leading one.
          #
          #   latest       newest release of the highest released minor; this is
          #                what a bare `npm install` resolves to
          #   vX.Y-latest  newest release of a superseded minor (a hotfix)
          #   next         release candidates toward the next, unreleased minor
          #   vX.Y-next    release candidates toward the next patch of a minor
          #                that has already been released
          #   beta, rc,    a prerelease git tag takes its dist-tag from its own
          #   alpha, ...   prerelease identifier: v2.1.0-beta publishes version
          #                2.1.0-beta under `beta`. Not part of the leading-line
          #                rule and deliberately outside it - a prerelease is
          #                never allowed to resolve to any of the four tags above
          #
          # The tag is computed once and used for all three packages, with
          # @opencrvs/toolkit as the reference for npm state. They publish in
          # lockstep at a single version, and consistency across them matters
          # more than per-package precision: toolkit on `latest` while
          # @opencrvs/mosip sat on `v2.1-latest` for the same release would be
          # worse than either choice applied uniformly.

          # Parse the version once, strictly. Every rule below is written in
          # terms of these fields, so a version that does not parse has to stop
          # the publish rather than fall through to a default - falling through
          # to `latest` is the bug this whole scheme exists to prevent. Build
          # metadata ("+sha") is refused for the same reason: no tag in the
          # vocabulary describes it.
          if ! [[ "$TOOLKIT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "❌ Cannot derive a dist-tag: '$TOOLKIT_VERSION' is not X.Y.Z or X.Y.Z-prerelease"
            exit 1
          fi
          VERSION_MAJOR="${BASH_REMATCH[1]}"
          VERSION_MINOR="${BASH_REMATCH[2]}"
          VERSION_PRERELEASE="${BASH_REMATCH[5]}"
          VERSION_LINE="$VERSION_MAJOR.$VERSION_MINOR"

          # Numeric comparison of two X.Y.Z releases. jq does the ordering: each
          # version becomes [major, minor, patch] and arrays compare
          # element-wise, so 2.10.0 > 2.9.9 and 2.1.10 > 2.1.9 - both of which a
          # string comparison gets backwards.
          version_ge() {
            [ "$(jq -n --arg a "$1" --arg b "$2" \
                   '($a | split(".") | map(tonumber)) >= ($b | split(".") | map(tonumber))')" = true ]
          }

          # `npm view` exits nonzero when the package does not exist at all, and
          # prints a bare JSON string instead of an array when it has exactly one
          # version; normalise both away. "Released" excludes anything carrying a
          # prerelease or build suffix, so neither a dispatched rc nor a
          # published 2.1.0-beta can influence which line counts as released.
          PUBLISHED_VERSIONS="$(npm view @opencrvs/toolkit versions --json 2>/dev/null || true)"
          RELEASED_VERSIONS="$(
            printf '%s' "${PUBLISHED_VERSIONS:-[]}" |
              jq -c 'if type == "array" then . else [.] end
                     | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))'
          )"

          # Two reference points, both needed: `latest` is about the highest
          # release overall, `vX.Y-latest` about the highest release on this
          # X.Y line. Either can be empty - the first-ever publish, and the
          # first release of a new line - which is not a failure, it is the
          # answer "nothing to be behind".
          HIGHEST_RELEASED="$(
            printf '%s' "$RELEASED_VERSIONS" |
              jq -r 'map(split(".") | map(tonumber))
                     | if length == 0 then "" else (max | map(tostring) | join(".")) end'
          )"
          HIGHEST_ON_LINE="$(
            printf '%s' "$RELEASED_VERSIONS" |
              jq -r --argjson line "[$VERSION_MAJOR, $VERSION_MINOR]" \
                 'map(split(".") | map(tonumber))
                  | map(select(.[0:2] == $line))
                  | if length == 0 then "" else (max | map(tostring) | join(".")) end'
          )"

          echo "Released versions on npm: $RELEASED_VERSIONS"
          echo "Highest release: ${HIGHEST_RELEASED:-<none>}"
          echo "Highest release on $VERSION_LINE: ${HIGHEST_ON_LINE:-<none>}"

          # Existence is settled before the derivation runs, not after it. The
          # release branch below refuses to name a tag for an ambiguous version,
          # and this workflow is meant to be safely re-runnable: a version that
          # is already on npm publishes nothing, so it must skip rather than trip
          # over that refusal. Equality is the everyday case of this - a version
          # equal to the highest release is, by definition, already published.
          if npm view "@opencrvs/toolkit@$TOOLKIT_VERSION" > /dev/null 2>&1; then
            echo "Version $TOOLKIT_VERSION already exists on npm."
            VERSION_EXISTS=true
          else
            echo "Version $TOOLKIT_VERSION does not exist on npm."
            VERSION_EXISTS=false
          fi

          if [ -n "$DIST_TAG_INPUT" ]; then
            # Explicit override, and the escape hatch for the refusal below. It
            # replaces the derived tag; it cannot be an addition to it, see above.
            NPM_TAG="$DIST_TAG_INPUT"
            echo "Dist-tag overridden by workflow input"
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$VERSION_PRERELEASE" ]; then
            # A prerelease git tag: v2.1.0-beta, v2.1.0-rc.1, v2.1.0-alpha.2. The
            # dist-tag is the first dot-separated identifier of the prerelease
            # suffix, so those give `beta`, `rc` and `alpha`. Parsed rather than
            # string-matched on "beta", which would leave every other suffix
            # undefined and would also match v2.1.0-notbeta.
            #
            # This branch sits ahead of the release branch and is the only one a
            # prerelease git tag can reach, so a prerelease cannot be handed
            # `latest` - the original bug - or `next`. Neither can it spell a
            # "vX.Y-" tag: one identifier contains no ".", by definition. Only
            # the two bare words are reachable at all, and they are refused
            # rather than published. An identifier npm itself will not accept as
            # a tag, such as the "1" of v2.1.0-1.2, is refused downstream by
            # `npm publish` ("Tag name must not be a valid SemVer range").
            NPM_TAG="${VERSION_PRERELEASE%%.*}"
            if [ -z "$NPM_TAG" ] || [ "$NPM_TAG" = latest ] || [ "$NPM_TAG" = next ]; then
              echo "❌ Prerelease '$TOOLKIT_VERSION' derives the dist-tag '$NPM_TAG', which collides with the derived tag vocabulary and would point real consumers at a prerelease. Rename the git tag, e.g. v$VERSION_LINE.0-beta."
              exit 1
            fi
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A release. `latest` belongs to the version that leads everything,
            # `vX.Y-latest` to one that leads its own line but not the package -
            # a hotfix on a superseded line. Both comparisons are on full
            # versions: comparing lines only, as this once did, lets a backport
            # tagged v2.1.2 satisfy "2.1 >= 2.1" while 2.1.5 is out and drag
            # `latest` backwards.
            if [ -z "$HIGHEST_RELEASED" ] || version_ge "$TOOLKIT_VERSION" "$HIGHEST_RELEASED"; then
              NPM_TAG=latest
            elif [ -z "$HIGHEST_ON_LINE" ] || version_ge "$TOOLKIT_VERSION" "$HIGHEST_ON_LINE"; then
              NPM_TAG="v$VERSION_LINE-latest"
            elif [ "$VERSION_EXISTS" = true ]; then
              # Behind on its own line, but already on npm: a re-run. Nothing
              # will be published and the tag goes unused, so it is left empty
              # rather than guessed. npm refuses an empty --tag outright, so a
              # sibling package that somehow lags at this version fails loudly
              # instead of quietly dragging a shared pointer to an older patch.
              NPM_TAG=""
              echo "⚠️ $TOOLKIT_VERSION is behind $HIGHEST_ON_LINE on its own line, and is already published; deriving no dist-tag."
            else
              # Neither the newest release nor the newest on its own line. No tag
              # in the vocabulary is true of it, and mislabelling is worse than
              # stopping: `latest` would move backwards, and "v$VERSION_LINE-latest"
              # would point the line at an older patch than it already has.
              echo "❌ Refusing to publish $TOOLKIT_VERSION: it is neither newer than the highest release ($HIGHEST_RELEASED) nor the newest on its own line ($HIGHEST_ON_LINE), so no dist-tag describes it."
              echo "   If this is deliberate, re-run from workflow_dispatch with an explicit dist_tag."
              exit 1
            fi
          else
            # A release candidate from workflow_dispatch. `next` belongs to the
            # minor that has not been released yet. Once X.Y has a release,
            # further rcs on that line are patch candidates and take vX.Y-next,
            # so dispatching from a release/2.0.2 branch can no longer clobber
            # `next` - which is how `next` previously ended up pointing at a
            # 2.0.1-rc build.
            if [ -n "$HIGHEST_ON_LINE" ]; then
              NPM_TAG="v$VERSION_LINE-next"
            else
              NPM_TAG=next
            fi
          fi

          echo "Publishing $TOOLKIT_VERSION under dist-tag '$NPM_TAG'"

          {
            echo "npm-tag=$NPM_TAG"
            echo "toolkit-version=$TOOLKIT_VERSION"
            echo "version-exists=$VERSION_EXISTS"
          } >> "$GITHUB_OUTPUT"
        working-directory: packages/toolkit

      - name: Install dependencies
        if: steps.check-version.outputs.version-exists == 'false'
        run: pnpm install --frozen-lockfile
        working-directory: packages/toolkit

      - name: Build
        if: steps.check-version.outputs.version-exists == 'false'
        run: pnpm build:all
        working-directory: packages/toolkit

      - name: Update package.json version
        if: steps.check-version.outputs.version-exists == 'false'
        run: |
          TOOLKIT_VERSION="${{ steps.check-version.outputs.toolkit-version }}"
          jq --arg version "$TOOLKIT_VERSION" '.version = $version' package.json > tmp.$$.json && mv tmp.$$.json package.json
        working-directory: packages/toolkit

      # Pack the toolkit to verify it can be ran before publishing. Fixes issues where the package is published but is not runnable due to missing dependencies.
      - name: Pack toolkit
        if: steps.check-version.outputs.version-exists == 'false'
        id: pack-toolkit
        run: |
          TARBALL_NAME=$(npm pack --silent)
          echo "tarball-path=$PWD/$TARBALL_NAME" >> $GITHUB_OUTPUT
        working-directory: packages/toolkit

      - name: Smoke test packed toolkit in clean project
        if: steps.check-version.outputs.version-exists == 'false'
        run: |
          TMP_DIR=$(mktemp -d)
          npm init -y --prefix "$TMP_DIR" > /dev/null
          npm install --prefix "$TMP_DIR" --omit=dev "${{ steps.pack-toolkit.outputs.tarball-path }}"
          TMP_DIR="$TMP_DIR" node - <<'NODE'
          const { createRequire } = require('node:module')
          const requireFromTmp = createRequire(process.env.TMP_DIR + '/package.json')

          requireFromTmp('@opencrvs/toolkit/api')
          requireFromTmp('@opencrvs/toolkit/events')
          NODE

      - name: Publish to npm
        if: steps.check-version.outputs.version-exists == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.check-version.outputs.npm-tag }}"
        working-directory: packages/toolkit

      - name: Check if create-countryconfig version exists on npm
        id: check-create-version
        run: |
          TOOLKIT_VERSION="${{ steps.check-version.outputs.toolkit-version }}"
          if npm view "@opencrvs/create-countryconfig@$TOOLKIT_VERSION" > /dev/null 2>&1; then
            echo "Version $TOOLKIT_VERSION already exists on npm."
            echo "version-exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $TOOLKIT_VERSION does not exist on npm."
            echo "version-exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update create-countryconfig package.json version
        if: steps.check-create-version.outputs.version-exists == 'false'
        run: |
          TOOLKIT_VERSION="${{ steps.check-version.outputs.toolkit-version }}"
          jq --arg version "$TOOLKIT_VERSION" '.version = $version' package.json > tmp.$$.json && mv tmp.$$.json package.json
        working-directory: packages/toolkit/create-countryconfig

      - name: Publish create-countryconfig to npm
        if: steps.check-create-version.outputs.version-exists == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.check-version.outputs.npm-tag }}"
        working-directory: packages/toolkit/create-countryconfig

      - name: Check if mosip version exists on npm
        id: check-mosip-version
        run: |
          TOOLKIT_VERSION="${{ steps.check-version.outputs.toolkit-version }}"
          if npm view "@opencrvs/mosip@$TOOLKIT_VERSION" > /dev/null 2>&1; then
            echo "Version $TOOLKIT_VERSION already exists on npm."
            echo "version-exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $TOOLKIT_VERSION does not exist on npm."
            echo "version-exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install mosip dependencies
        if: steps.check-mosip-version.outputs.version-exists == 'false'
        run: pnpm install --frozen-lockfile
        working-directory: packages/mosip

      # Built through the workspace graph so @opencrvs/toolkit is built first:
      # mosip's sources import types from it, and the toolkit build above is
      # skipped when its version is already on npm.
      - name: Build mosip country-config helpers
        if: steps.check-mosip-version.outputs.version-exists == 'false'
        run: pnpm exec nx run @opencrvs/mosip:build
        working-directory: packages/mosip

      - name: Update mosip package.json version
        if: steps.check-mosip-version.outputs.version-exists == 'false'
        run: |
          TOOLKIT_VERSION="${{ steps.check-version.outputs.toolkit-version }}"
          jq --arg version "$TOOLKIT_VERSION" '.version = $version' package.json > tmp.$$.json && mv tmp.$$.json package.json
        working-directory: packages/mosip

      # The workspace link to @opencrvs/toolkit is a devDependency used only for
      # types, so it does not appear in the published manifest. Packing verifies
      # the build output is actually present and requirable before publishing.
      - name: Smoke test packed mosip in clean project
        if: steps.check-mosip-version.outputs.version-exists == 'false'
        run: |
          TARBALL_NAME=$(npm pack --silent)
          TMP_DIR=$(mktemp -d)
          npm init -y --prefix "$TMP_DIR" > /dev/null
          npm install --prefix "$TMP_DIR" --omit=dev "$PWD/$TARBALL_NAME"
          TMP_DIR="$TMP_DIR" node - <<'NODE'
          const { createRequire } = require('node:module')
          const requireFromTmp = createRequire(process.env.TMP_DIR + '/package.json')

          requireFromTmp('@opencrvs/mosip')
          requireFromTmp('@opencrvs/mosip/api')
          NODE
        working-directory: packages/mosip

      - name: Publish mosip to npm
        if: steps.check-mosip-version.outputs.version-exists == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.check-version.outputs.npm-tag }}"
        working-directory: packages/mosip

name: Clean up environment on PR close

on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch-name:
        description: 'Branch name'
        required: true
        default: ''

jobs:
  get-k8s-stack-name-from-branch:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    outputs:
      stack: ${{ steps.slugify-branch-name.outputs.stack }}
    steps:
      - name: Get branch name from manual input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "BRANCH_NAME=${{ github.event.inputs.branch-name }}" >> $GITHUB_ENV

      - name: Get branch name from event
        if: ${{ github.event_name == 'pull_request' }}
        id: get-pr-by-trigger
        run: |
          echo '${{ toJSON(github.event.pull_request) }}' | jq .
          echo "BRANCH_NAME=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV

      - name: Slugify the branch name for k8s
        id: slugify-branch-name
        uses: actions/github-script@v8
        with:
          script: |
            function slugify(str) {
              return str
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .trim()
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .substr(0, 30)
                .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
            }
            core.setOutput('stack', slugify('${{ env.BRANCH_NAME }}'));

  trigger-cleanup:
    needs: [get-k8s-stack-name-from-branch]
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger namespace cleanup workflow in e2e
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/opencrvs/e2e/actions/workflows/set-keep-namespace-label-to-false.yml/dispatches \
            -d '{"ref": "main", "inputs": {"stack": "${{ needs.get-k8s-stack-name-from-branch.outputs.stack }}"}}'

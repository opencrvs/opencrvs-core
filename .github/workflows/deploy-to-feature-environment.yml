name: Deploy PR to feature environment

on:
  pull_request:
    types:
      - labeled
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      keep_e2e:
        description: 'Keep E2E environment after tests'
        required: true
        type: boolean

concurrency:
  group: ${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  E2E_REPO_NAME: ${{ vars.E2E_REPO_NAME || 'e2e' }}
  E2E_REPO_OWNER: ${{ vars.E2E_REPO_OWNER || 'opencrvs' }}

jobs:
  # Validate branch name and read the e2e-related labels off the PR
  check_skip_e2e_label:
    runs-on: ubuntu-26.04
    outputs:
      skip_e2e: ${{ steps.set_skip_flag.outputs.SKIP_E2E }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate branch name
        id: validate
        uses: ./.github/actions/validate-branch
        with:
          # Dots are allowed so that `release/x.y.z` branches validate. The
          # stack name is slugified downstream (`[^\w\s-]` is stripped), so a
          # dot in the branch name never reaches an environment name.
          pattern: '^[a-z][a-z0-9/.-]{1,44}$'

      - name: Check for e2e labels
        id: set_skip_flag
        run: |
          SKIP=false
          mapfile -t LABELS < <(jq -r '.pull_request.labels // [] | .[].name' $GITHUB_EVENT_PATH)

          echo "All labels on this PR:"
          for label in "${LABELS[@]}"; do
            echo "- $label"
            if [[ "$label" == "Skip e2e" ]]; then
              SKIP=true
            fi
          done

          echo "SKIP_E2E=$SKIP" >> $GITHUB_OUTPUT

          if [ "$SKIP" == "true" ]; then
            echo "skip-e2e label detected — skipping e2e"
          fi

  generate_stack_name_and_branch:
    needs: check_skip_e2e_label
    if: ${{ needs.check_skip_e2e_label.outputs.skip_e2e != 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      branch_name: ${{ steps.set_branch_and_pr_number.outputs.BRANCH_NAME }}
      pr_number: ${{ steps.set_branch_and_pr_number.outputs.PR_NUMBER }}
      keep_e2e: ${{ steps.set_branch_and_pr_number.outputs.keep_e2e }}
      author: ${{ steps.get_author.outputs.AUTHOR }}
      stack: ${{ steps.slugify_bname.outputs.stack }}
      e2e_branch: ${{ steps.get_e2e_branch.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Get input data (when manually triggered)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          PR_NUMBER=${{ inputs.pr_number }}
          PR_DATA=$(gh pr view $PR_NUMBER --json headRefName,headRefOid)
          BRANCH_NAME=$(echo "$PR_DATA" | jq -r '.headRefName')
          echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV
          echo "keep_e2e=${{ inputs.keep_e2e }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Get PR labels on push event
        uses: 8BitJonny/gh-get-current-pr@3.0.0
        if: github.event_name == 'push'
        id: PR_push

      # TODO: Replace curl usage to gh cli
      - name: Get PR labels on pull_request event
        id: PR_pull
        if: github.event_name == 'pull_request'
        run: |
          pr_number=${{ github.event.pull_request.number }}
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/issues/${pr_number}")
          labels=$(echo "$response" | jq '.labels | map(.name) | join(",")' | sed 's/"//g')
          echo pr_labels=$labels >> $GITHUB_OUTPUT

      - name: Get input data (when triggered by event)
        if: github.event_name != 'workflow_dispatch'
        id: label_check
        run: |
          if [[ ${{github.event_name}} == 'pull_request' ]]
          then
            labels="${{ steps.PR_pull.outputs.pr_labels }}"
            pr_number=${{ github.event.pull_request.number }}
          else
            labels="${{ steps.PR_push.outputs.pr_labels }}"
            pr_number="${{ steps.PR_push.outputs.number }}"
          fi
          echo "Labels found: $labels"
          echo "PR number: $pr_number"
          if [[ "${labels}" != *"🔒 Keep e2e"* ]]; then
            echo "Label not found or incorrect, skipping dispatch."
            echo keep_e2e=false >> $GITHUB_ENV
          else
            echo "Correct label added, dispatching deploy workflow."
            echo keep_e2e=true >> $GITHUB_ENV
          fi
          echo PR_NUMBER=$pr_number >> $GITHUB_ENV

      - name: Get Branch Name (on PR creation)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          echo "BRANCH_NAME=$(echo ${{ github.head_ref }})" >> $GITHUB_ENV
      - name: Get e2e branch
        id: get_e2e_branch
        # ls-remote should provide list of branches. When none are found, it should be empty string.
        run: |
          e2e_repo_url="https://github.com/${E2E_REPO_OWNER}/${E2E_REPO_NAME}.git"
          if [ -n "$(git ls-remote --heads "$e2e_repo_url" "refs/heads/${{ github.head_ref }}")" ]; then
            e2e_branch=${{ github.head_ref }}
          elif [ -n "$(git ls-remote --heads "$e2e_repo_url" "refs/heads/${{ github.base_ref }}")" ]; then
            e2e_branch="${{ github.base_ref }}"
          else
            e2e_branch="develop"
          fi
          echo "e2e branch name=${e2e_branch}"
          echo "branch=$e2e_branch" >> $GITHUB_OUTPUT
      - name: Get PR Author
        id: get_author
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTHOR=$(gh pr view $PR_NUMBER --json author --jq '.author.login')
          echo "PR is created by $AUTHOR"
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Set output variables
        id: set_branch_and_pr_number
        run: |
          echo "BRANCH_NAME=${{ env.BRANCH_NAME }}" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ env.PR_NUMBER }}" >> $GITHUB_OUTPUT
          echo "keep_e2e=${{ env.keep_e2e }}" >> $GITHUB_OUTPUT

      - name: Slugify the branch name
        id: slugify_bname
        uses: actions/github-script@v9
        with:
          script: |
            function slugify(str) {
              return str
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .trim()
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .substr(0, 30)
                .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
            }
            core.setOutput('stack', slugify('${{ env.BRANCH_NAME }}'));

  trigger-build:
    if: ${{ (github.event_name == 'workflow_dispatch') || (!contains(github.actor, 'bot') && github.event.pull_request.head.repo.fork == false) }}
    needs: generate_stack_name_and_branch
    uses: ./.github/workflows/build-images-from-branch.yml
    with:
      branch_tag_name: ${{ needs.generate_stack_name_and_branch.outputs.branch_name }}
      skip_security_check: true
    secrets: inherit

  # Deploys and seeds the environment in opencrvs/e2e. E2E tests run in this
  # repository (run-e2e-tests) once the deploy finishes.
  trigger-e2e-deploy:
    runs-on: ubuntu-26.04
    needs: [check_skip_e2e_label, generate_stack_name_and_branch, trigger-build]
    if: ${{ needs.check_skip_e2e_label.outputs.skip_e2e != 'true' }}
    env:
      stack: ${{ needs.generate_stack_name_and_branch.outputs.stack }}
      domain: ${{ needs.generate_stack_name_and_branch.outputs.stack }}.${{ vars.E2E_DOMAIN }}
    outputs:
      run_id: ${{ steps.dispatch_e2e_deploy.outputs.run_id }}
      head_sha: ${{ steps.pr_info.outputs.HEAD_SHA }}
    steps:
      - uses: actions/checkout@v7
      - name: Check trigger-build status and exit on non-success
        run: |
          if [ ${{ needs.trigger-build.outputs.build_status }} == 'success' ]; then
            echo "Trigger build completed without issues"
          else
            echo "Trigger build job failed"
            exit 1
          fi

      - name: Parse the branch name and set it as environment variable
        run: |
          BRANCH_NAME=${{ needs.generate_stack_name_and_branch.outputs.branch_name }}
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Get PR Information
        id: pr_info
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ needs.generate_stack_name_and_branch.outputs.pr_number }}
          PR_DATA=$(gh pr view $PR_NUMBER --json headRefName,headRefOid)

          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          echo "HEAD_SHA=${HEAD_SHA}" >> $GITHUB_OUTPUT

          HEAD_COMMIT_HASH=$(echo "$HEAD_SHA" | cut -c1-7)
          echo "HEAD_COMMIT_HASH=${HEAD_COMMIT_HASH}" >> $GITHUB_ENV

      - name: Parse the stack name
        id: generate_stack
        run: |
          echo "core_branch=${{ github.event.repository.private && github.base_ref || env.BRANCH_NAME }}" >> $GITHUB_OUTPUT
      - name: Output Variables
        run: |
          echo """
          PR Branch: ${{ env.BRANCH_NAME }}
          PR Head Commit Hash: ${{ env.HEAD_COMMIT_HASH }}
          Keep e2e: ${{ needs.generate_stack_name_and_branch.outputs.keep_e2e }}
          E2E Branch: ${{ needs.generate_stack_name_and_branch.outputs.e2e_branch }}
          Core Branch (Helm charts): ${{ steps.generate_stack.outputs.core_branch }}
          Stack: ${{ env.stack }}
          """

      - name: Trigger E2E Deploy
        id: dispatch_e2e_deploy
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.E2E_WORKFLOWS_TOKEN }}
          script: |
            const e2eBranch = '${{ needs.generate_stack_name_and_branch.outputs.e2e_branch }}';

            const result = await github.rest.actions.createWorkflowDispatch({
              owner: process.env.E2E_REPO_OWNER,
              repo: process.env.E2E_REPO_NAME,
              workflow_id: 'deploy-e2e-environment.yml',
              ref: e2eBranch,

              // Important: ask API to return run details
              return_run_details: true,

              headers: {
                'X-GitHub-Api-Version': '2026-03-10',
              },

              inputs: {
                'core-image-tag': '${{ env.HEAD_COMMIT_HASH }}',
                'core-branch': '${{ steps.generate_stack.outputs.core_branch }}',
                stack: '${{ env.stack }}',
                'keep-e2e': '${{ needs.generate_stack_name_and_branch.outputs.keep_e2e }}',
                branch: e2eBranch,
                'actor': '${{ github.actor }}',
                registry: '${{ vars.TARGET_REPO || 'ghcr.io/opencrvs' }}',
              },
            });

            console.log(JSON.stringify(result.data, null, 2));

            const runId = result.data.workflow_run_id;

            if (!runId) {
              throw new Error(`workflow_run_id was not returned. Response: ${JSON.stringify(result.data)}`);
            }

            core.setOutput('run_id', runId);
            core.setOutput('run_url', result.data.html_url);

            console.log(`Triggered runId: ${runId}`);
            console.log(`Run URL: ${result.data.html_url}`);

      - name: Print link to E2E deploy workflow run
        id: print-links
        run: |
          E2E_RUN_LINK="https://github.com/${E2E_REPO_OWNER}/${E2E_REPO_NAME}/actions/runs/${{ steps.dispatch_e2e_deploy.outputs.run_id }}"

          echo """
          # E2E Environment summary
          Deploy workflow (pipeline): $E2E_RUN_LINK
          All Deployments: https://github.com/${E2E_REPO_OWNER}/${E2E_REPO_NAME}/deployments/${{ env.stack }}

          Web link: https://${{ env.domain }}

          **NOTE**: Web link is available only while deployment, if you would like to
          keep environment accessible for debug purposes, please add '🔒 Keep e2e' to PR
          https://github.com/${{ github.repository }}/pull/${{ needs.generate_stack_name_and_branch.outputs.pr_number }}
          """ >> $GITHUB_STEP_SUMMARY

  listen-e2e-deploy:
    needs: [trigger-e2e-deploy, generate_stack_name_and_branch]
    runs-on: ubuntu-26.04
    env:
      domain: ${{ needs.generate_stack_name_and_branch.outputs.stack }}.${{ vars.E2E_DOMAIN }}
    steps:
      - name: Wait for E2E Deploy Workflow Completion
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.E2E_WORKFLOWS_TOKEN }}
          script: |
            const owner = process.env.E2E_REPO_OWNER;
            const repo = process.env.E2E_REPO_NAME;
            const runId = ${{ needs.trigger-e2e-deploy.outputs.run_id }};
            let run;

            // Besides queued / in_progress, a run can also be waiting, pending or requested.
            while (run?.status !== 'completed') {
              if (run) {
                await new Promise(resolve => setTimeout(resolve, 10000));
              }

              run = (await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: runId
              })).data;

              console.log(`Current status: ${run.status}`);
            }

            console.log(`E2E deploy workflow finished with conclusion: ${run.conclusion}`);
            if (run.conclusion !== 'success') {
              throw new Error(`E2E deploy workflow did not succeed (${run.conclusion}): ${run.html_url}`);
            }
      - name: Update github comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.CORE_ISSUES_PR_TOKEN }}
          script: |
            const prNumber = ${{ needs.generate_stack_name_and_branch.outputs.pr_number }};
            const deployMessage = `Your environment is deployed to https://${{ env.domain }}`;
            // Check if the comment already exists
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existingComment = comments.data.find(comment => comment.body.includes(deployMessage));
            if (!existingComment) {
              // Add PR comment if it doesn't exist
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: deployMessage
              });
              console.log('PR comment added');
            } else {
              console.log('PR comment already exists, skipping...');
            }

  run-e2e-tests:
    needs:
      [generate_stack_name_and_branch, trigger-e2e-deploy, listen-e2e-deploy]
    uses: ./.github/workflows/e2e-tests.yml
    with:
      domain: ${{ needs.generate_stack_name_and_branch.outputs.stack }}.${{ vars.E2E_DOMAIN }}
      # The commit the deployed images were built from
      ref: ${{ needs.trigger-e2e-deploy.outputs.head_sha }}

  # Required check for e2e: a reusable-workflow caller can't report under its
  # own name. Upstream jobs are in `needs` because a failed deploy skips
  # run-e2e-tests, and a skip alone would pass.
  e2e-tests:
    name: e2e-tests
    needs:
      - check_skip_e2e_label
      - generate_stack_name_and_branch
      - trigger-build
      - trigger-e2e-deploy
      - listen-e2e-deploy
      - run-e2e-tests
    # `always()`, or a skipped dependency would skip this job too and take
    # the gate down with it
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Fail unless every dependency succeeded or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more e2e jobs failed or were cancelled."
          exit 1

  # Tear the environment down in opencrvs/e2e once the tests pass, unless the
  # PR asks to keep it ('🔒 Keep e2e').
  cleanup-e2e:
    needs: [generate_stack_name_and_branch, run-e2e-tests]
    if: ${{ needs.generate_stack_name_and_branch.outputs.keep_e2e != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger E2E Cleanup
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.E2E_WORKFLOWS_TOKEN }}
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: process.env.E2E_REPO_OWNER,
              repo: process.env.E2E_REPO_NAME,
              workflow_id: 'cleanup-namespace-by-name.yml',
              ref: '${{ needs.generate_stack_name_and_branch.outputs.e2e_branch }}',

              return_run_details: true,

              headers: {
                'X-GitHub-Api-Version': '2026-03-10',
              },
              inputs: {
                namespace: 'opencrvs-${{ needs.generate_stack_name_and_branch.outputs.stack }}',
              },
            });

            console.log(`Cleanup run URL: ${result.data.html_url}`);

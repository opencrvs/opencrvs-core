name: Check Postgres migrations

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  check-postgres-migrations:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialise events database
        # Service containers start before checkout, so the init script cannot be
        # mounted into docker-entrypoint-initdb.d as docker-compose.dev-deps.yml does
        run: >
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
          < packages/migration/src/migrations/postgres/0001_init.sql

      - name: Run migrations
        # run-migrations.sh substitutes env vars into the SQL migrations with envsubst
        env:
          MINIO_BUCKET: ocrvs
        run: |
          command -v envsubst || sudo apt-get install -y gettext-base
          pnpm --dir packages/migration start

      - name: Generate Kanel database types
        run: pnpm --dir packages/events generate-db-types

      - name: Fail if generated database types differ
        run: |
          changes=$(git status --porcelain -- packages/events/src/storage/postgres/events/schema)

          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- packages/events/src/storage/postgres/events/schema
            echo "::error::Generated database types are out of date. Run \`pnpm generate-db-types\` in packages/events and commit the result."
            exit 1
          fi

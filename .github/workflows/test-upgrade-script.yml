name: Test v2.0 -> v2.1 Upgrade Script

on:
  pull_request:
  workflow_dispatch:
    inputs:
      farajaland-branch:
        description: farajaland branch name
        default: release/2.0.0
        required: true
      ref:
        description: Commit SHA / branch / tag to checkout (optional)
        required: false

jobs:
  test-upgrade-script:
    runs-on: ubuntu-26.04
    env:
      FARAJALAND_BRANCH: ${{ github.event.inputs.farajaland-branch || 'release/2.0.0' }}
      # yarn 1.22 refuses to run inside a workspace whose package.json pins
      # packageManager: pnpm; the farajaland side of this job still uses yarn
      SKIP_YARN_COREPACK_CHECK: 1
    steps:
      - name: Checkout opencrvs-core repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install core dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm install --frozen-lockfile
      - name: Build toolkit
        run: pnpm build:all
        working-directory: packages/toolkit
      - name: Checkout the correct opencrvs-farajaland branch
        run: |
          git clone -b ${{ env.FARAJALAND_BRANCH }} https://github.com/opencrvs/opencrvs-farajaland.git
      - name: Install opencrvs-farajaland dependencies
        working-directory: opencrvs-farajaland
        run: yarn install
      - name: Link toolkit
        run: |
          cd packages/toolkit && yarn link
          cd ../../opencrvs-farajaland && yarn link @opencrvs/toolkit
      - name: Run upgrade script on farajaland
        run: |
          cd opencrvs-farajaland
          ./node_modules/@opencrvs/toolkit/dist/cli.js upgrade
          # remove unused files
          rm -rf src/api/notification/testData.ts
          yarn --force
      - name: Test opencrvs-farajaland compilation
        run: yarn test:compilation
        working-directory: opencrvs-farajaland

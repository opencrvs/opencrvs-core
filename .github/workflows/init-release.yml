# Starts a release. Run it manually with a semver version, e.g. 1.9.24.
#
# The release is made on its line's branch, release/<major>.<minor>.x
# (1.9.24 -> release/1.9.x), which gets two commits: the version bump and an
# empty CHANGELOG section for the version. A <minor>.0 version cuts the line's
# branch from develop first.
#
# Carrying the release up into the newer lines and develop is done by the
# forward-merge workflow (forward-merge-release-lines.yml), not here.
name: Release - Start a new release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to release'

env:
  VERSION: ${{ inputs.version }}

jobs:
  release_workflow:
    runs-on: ubuntu-latest
    steps:
      # Runs before the checkout, so it cannot read the repository.
      - name: Work out the release line
        id: line
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a semver version, e.g. 1.9.24"
            exit 1
          fi

          IFS='.' read -r x y _ <<< "$VERSION"
          echo "branch=release/$x.$y.x" >> "$GITHUB_OUTPUT"

      # Full history is required so lerna can traverse the commit graph.
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check out ${{ steps.line.outputs.branch }}
        env:
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$LINE_BRANCH" > /dev/null 2>&1; then
            git checkout -B "$LINE_BRANCH" "origin/$LINE_BRANCH"
          elif [[ $VERSION == *.0 ]]; then
            echo "$LINE_BRANCH doesn't exist yet; cutting it from develop."
            git checkout -b "$LINE_BRANCH"
          else
            echo "::error::$LINE_BRANCH does not exist. Start $LINE_BRANCH with its .0 release first."
            exit 1
          fi

      # Each commit is skipped when it is already there, so a re-run is safe.
      - name: Bump the version and add a CHANGELOG section
        env:
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          if [ "$(jq -r .version package.json)" = "$VERSION" ]; then
            echo "package.json is already on $VERSION."
          else
            npx lerna exec "yarn version --new-version $VERSION --no-git-tag-version"
            yarn version --new-version "$VERSION" --no-git-tag-version
            git add .
            git commit -m "chore: update version to $VERSION"
          fi

          if grep -qx "## $VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md already has a $VERSION section."
          else
            # Insert "## <version>" right below the "# Changelog" header.
            sed -i "0,/^# Changelog$/s//# Changelog\n\n## $VERSION/" CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "docs: add $VERSION to the changelog"
          fi

          git push origin "$LINE_BRANCH"

      # The companion repos cut their own release branches. target_branch tells
      # them which of core's branches the release is made on.
      #
      # TODO: countryconfig, testland and helm-charts only cut release branches on
      # the 1.9.x line; 2.0 ships its charts from this repo. Drop them from this
      # list once this branch reaches develop.
      - name: Trigger the companion workflows
        env:
          COUNTRYCONFIG_TOKEN: ${{ secrets.COUNTRYCONFIG_WORKFLOW_TOKEN }}
          INFRASTRUCTURE_TOKEN: ${{ secrets.INFRASTRUCTURE_WORKFLOW_TOKEN }}
          TESTLAND_TOKEN: ${{ secrets.TESTLAND_WORKFLOW_TOKEN }}
          HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_WORKFLOW_TOKEN }}
        run: |
          trigger() { # repo, token
            GH_TOKEN="$2" gh workflow run init-release.yml \
              --repo "opencrvs/$1" \
              --ref "${{ github.ref_name }}" \
              -f version="$VERSION" \
              -f target_branch="${{ steps.line.outputs.branch }}"
            echo "Triggered init-release in $1"
          }

          trigger opencrvs-countryconfig "$COUNTRYCONFIG_TOKEN"
          trigger infrastructure "$INFRASTRUCTURE_TOKEN"
          trigger opencrvs-testland "$TESTLAND_TOKEN"
          trigger helm-charts "$HELM_CHARTS_TOKEN"

      # Cut from e2e's branch for the same line, or from develop if it has none.
      - name: Create the release branch in the e2e repo
        env:
          GH_TOKEN: ${{ secrets.E2E_WORKFLOW_TOKEN }}
          RELEASE_BRANCH: release/${{ inputs.version }}
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          if gh api "repos/opencrvs/e2e/git/ref/heads/$RELEASE_BRANCH" > /dev/null 2>&1; then
            echo "$RELEASE_BRANCH already exists in e2e, skipping."
            exit 0
          fi

          if ! sha=$(gh api "repos/opencrvs/e2e/git/ref/heads/$LINE_BRANCH" --jq .object.sha 2>/dev/null); then
            sha=$(gh api "repos/opencrvs/e2e/git/ref/heads/develop" --jq .object.sha)
          fi
          gh api repos/opencrvs/e2e/git/refs -f ref="refs/heads/$RELEASE_BRANCH" -f sha="$sha" > /dev/null
          echo "Created $RELEASE_BRANCH in e2e"

      # The draft gives the release notes somewhere to be written while the
      # release is in flight. Its tag is deleted again so nothing points at
      # unreleased code — the real tag is cut by hand once the release ships.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --draft \
            --title "OpenCRVS - $TAG" \
            --notes "Release notes for version $VERSION"

          git tag -d "$TAG"
          git push origin ":refs/tags/$TAG"

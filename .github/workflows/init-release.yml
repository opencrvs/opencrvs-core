# Starts a release on its line's branch, release/<major>.<minor>.x, where the
# version bump and an empty CHANGELOG section are committed.
# forward-merge-release-lines.yml carries it into the newer lines.
#
# When a release vX.Y.Z is published, this workflow starts the next patch,
# X.Y.(Z+1), so that the fixes after the release have a CHANGELOG section.
# Run it by hand for the first release of a line, X.Y.0.
name: Release - Start a new release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to release'

# Pushes the line branch and the draft release's tag. The companion repos and
# e2e are reached with their own tokens.
permissions:
  contents: write

jobs:
  release_workflow:
    # A pre-release, or a tag such as v2.1.0-beta, does not start a patch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease &&
       startsWith(github.event.release.tag_name, 'v') &&
       !contains(github.event.release.tag_name, '-'))
    runs-on: ubuntu-latest
    steps:
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag, so the next patch is not known."
            exit 1
          fi

          IFS='.' read -r x y z <<< "${TAG#v}"
          echo "VERSION=$x.$y.$((z + 1))" >> "$GITHUB_ENV"
          echo "$TAG is published. The next patch is $x.$y.$((z + 1))."

      # Runs before the checkout, so it cannot read the repository.
      - name: Work out the release line
        id: line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a semver version, e.g. 1.9.24"
            exit 1
          fi

          IFS='.' read -r x y _ <<< "$VERSION"
          branch="release/$x.$y.x"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > /dev/null 2>&1; then
            echo "::error::$branch does not exist. Create it before starting $VERSION."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Full history is required so lerna can traverse the commit graph.
      - name: Checkout ${{ steps.line.outputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.line.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Each commit is skipped when it is already there, so a re-run is safe.
      # Only the "version" fields of the package.json files on the line's
      # current version and the CHANGELOG change: charts, image tags and the
      # Tiltfile keep pointing at the published release until it ships.
      - name: Bump the version and add a CHANGELOG section
        env:
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          current=$(jq -r .version package.json)
          if [ "$current" = "$VERSION" ]; then
            echo "package.json is already on $VERSION."
          else
            # A sed on the "version" line, not yarn/npm version, so no lifecycle
            # script runs and the rest of each file stays byte for byte the same.
            git ls-files '*package.json' | while read -r file; do
              if [ "$(jq -r '.version // ""' "$file")" = "$current" ]; then
                sed -i "0,/\"version\": \"$current\"/s//\"version\": \"$VERSION\"/" "$file"
                git add -- "$file"
              fi
            done
            git commit -m "chore: update version to $VERSION"
          fi

          # A section left over from the old flow may still say "Release Candidate".
          if grep -qxE "## ${VERSION//./\\.}( Release Candidate)?" CHANGELOG.md; then
            echo "CHANGELOG.md already has a $VERSION section."
          else
            # Insert "## <version>" right below the "# Changelog" header.
            sed -i "0,/^# Changelog$/s//# Changelog\n\n## $VERSION/" CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "docs: add $VERSION to the changelog"
          fi

          # Refuse to push anything beyond the version fields and the CHANGELOG.
          unexpected=$(git diff --name-only "origin/$LINE_BRANCH" HEAD | grep -Ev '(^|/)package\.json$|^CHANGELOG\.md$' || true)
          extra=$(git diff -U0 "origin/$LINE_BRANCH" HEAD -- '*package.json' | grep -E '^[-+] ' | grep -v '"version": ' || true)
          if [ -n "$unexpected" ] || [ -n "$extra" ]; then
            echo "::error::The release bump changed more than the version fields and the CHANGELOG:"
            echo "$unexpected"
            echo "$extra"
            exit 1
          fi

          git push origin "$LINE_BRANCH"

      # The companion repos cut their own release branches. target_branch tells
      # them which of core's branches the release is made on.
      #
      # countryconfig and testland run the workflow from their line branch.
      # infrastructure and helm-charts do not have a release/1.9.x branch, so
      # they run the workflow from develop.
      #
      # TODO: countryconfig, testland and helm-charts only cut release branches on
      # the 1.9.x line; 2.0 ships its charts from this repo. Drop them from this
      # list once this branch reaches develop.
      - name: Trigger the companion workflows
        env:
          COUNTRYCONFIG_TOKEN: ${{ secrets.COUNTRYCONFIG_WORKFLOW_TOKEN }}
          INFRASTRUCTURE_TOKEN: ${{ secrets.INFRASTRUCTURE_WORKFLOW_TOKEN }}
          TESTLAND_TOKEN: ${{ secrets.TESTLAND_WORKFLOW_TOKEN }}
          HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_WORKFLOW_TOKEN }}
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          trigger() { # repo, token, ref
            GH_TOKEN="$2" gh workflow run init-release.yml \
              --repo "opencrvs/$1" \
              --ref "$3" \
              -f version="$VERSION" \
              -f target_branch="${{ steps.line.outputs.branch }}"
            echo "Triggered init-release in $1"
          }

          trigger opencrvs-countryconfig "$COUNTRYCONFIG_TOKEN" "$LINE_BRANCH"
          trigger infrastructure "$INFRASTRUCTURE_TOKEN" develop
          trigger opencrvs-testland "$TESTLAND_TOKEN" "$LINE_BRANCH"
          trigger helm-charts "$HELM_CHARTS_TOKEN" develop

      # Core PRs into release/<major>.<minor>.x run against the e2e branch of
      # the same name. The first release of a line cuts that branch from e2e's
      # develop. Later releases find it and skip this step.
      - name: Create the line branch in the e2e repo
        env:
          GH_TOKEN: ${{ secrets.E2E_WORKFLOW_TOKEN }}
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          if gh api "repos/opencrvs/e2e/git/ref/heads/$LINE_BRANCH" > /dev/null 2>&1; then
            echo "$LINE_BRANCH already exists in e2e, skipping."
            exit 0
          fi

          sha=$(gh api "repos/opencrvs/e2e/git/ref/heads/develop" --jq .object.sha)
          gh api repos/opencrvs/e2e/git/refs -f ref="refs/heads/$LINE_BRANCH" -f sha="$sha" > /dev/null
          echo "Created $LINE_BRANCH in e2e"

      # The draft gives the release notes somewhere to be written while the
      # release is in flight. Its tag is deleted again so nothing points at
      # unreleased code — the real tag is cut by hand once the release ships.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --draft \
            --title "OpenCRVS - $TAG" \
            --notes "Release notes for version $VERSION"

          git tag -d "$TAG"
          git push origin ":refs/tags/$TAG"

name: Publish images from any branch or tag
run-name: Publish images from ${{ inputs.branch_tag_name || github.ref_name }}
env:
  CONTAINER_REGISTRY: ghcr.io/opencrvs
on:
  push:
    branches:
      - develop
      - main
    tags:
      - '*'
  workflow_call:
    inputs:
      branch_tag_name:
        required: true
        type: string
      publish_release:
        type: boolean
        required: false
        default: false
      skip_security_check:
        type: boolean
        required: false
        default: false
      build_arm:
        type: boolean
        default: false
        required: false
    outputs:
      build_status:
        description: build job output
        value: ${{ jobs.merge-services-manifest.result }}
  workflow_dispatch:
    inputs:
      branch_tag_name:
        default: develop
        required: true
        description: Branch (or tag) to build from
      publish_release:
        type: boolean
        default: false
        description: Runs additional checks for release version
      skip_security_check:
        type: boolean
        required: false
        default: false
        description: Skip security scanning of images
      build_arm:
        description: Build ARM images
        type: boolean
        default: false
        required: false
jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ (inputs.build_arm == true && fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm"]')) || fromJSON('["ubuntu-26.04"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.event.inputs.branch_tag_name }}

      - uses: actions/checkout@v6
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set version and branch
        id: set-version-and-branch
        env:
          BRANCH: ${{ inputs.branch_tag_name || github.ref_name }}
        run: |
          # Exactly 7 chars: %h length floats with the clone's object count,
          # and deploy-to-feature-environment.yml cuts the head sha to 7 when
          # it dispatches the e2e workflow — the tags must line up.
          export VERSION=$(git rev-parse HEAD | cut -c1-7)
          echo "Pushing version $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          ESCAPED_BRANCH=$(echo $BRANCH | sed 's/[^a-zA-Z0-9_.-]/-/g')
          echo "from branch $ESCAPED_BRANCH"
          echo "branch=$ESCAPED_BRANCH" >> $GITHUB_OUTPUT

      - name: Set architecture label
        id: arch_label
        run: |
          if [[ "${{ matrix.runner }}" == "ubuntu-26.04-arm" ]]; then
            echo "arch=-arm64" >> $GITHUB_OUTPUT
          else
            echo "arch=-amd64" >> $GITHUB_OUTPUT
          fi
      - name: Get list of services
        id: get-services
        run: |
          # Exclude countryconfig-template from the list of services to build, since it is not a deployable service.
          services_json=$(
            find packages -name Dockerfile |
              cut -f2 -d/ |
              grep -v '^countryconfig-template$' |
              jq -R -s -c '
                split("\n")[:-1] |
                map(. as $service |
                  if ["mosip-api", "mosip-mock", "esignet-mock"] | index($service) then
                    $service
                  else
                    "ocrvs-" + $service
                  end
                )
              '
          )
          # Set the list of service image names as an output variable.
          echo "services=$services_json" >> $GITHUB_OUTPUT
          echo "services=$services_json"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Build and push base image
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          action: docker/build-push-action@v7
          with: |
            file: packages/Dockerfile.base
            provenance: false
            push: true
            context: .
            tags: |
              ${{ env.CONTAINER_REGISTRY }}/ocrvs-base:${{ steps.set-version-and-branch.outputs.version }}${{ steps.arch_label.outputs.arch }}
              ${{ env.CONTAINER_REGISTRY }}/ocrvs-base:${{ steps.set-version-and-branch.outputs.branch }}${{ steps.arch_label.outputs.arch }}
            cache-from: type=registry,ref=${{ env.CONTAINER_REGISTRY }}/ocrvs-base:${{ steps.set-version-and-branch.outputs.branch }}${{ steps.arch_label.outputs.arch }}
            cache-to: type=inline

    outputs:
      services: ${{ steps.get-services.outputs.services }}
      version: ${{ steps.set-version-and-branch.outputs.version }}
      branch: ${{ steps.set-version-and-branch.outputs.branch }}

  merge-manifest:
    needs: [base]
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}
      - name: Create and push multi-arch manifest
        env:
          BUILD_ARM: ${{ inputs.build_arm == true || startsWith(github.ref, 'refs/tags/') }}
        run: |
          REPO="$CONTAINER_REGISTRY/ocrvs-base"
          for TAG in ${{ needs.base.outputs.branch }} ${{ needs.base.outputs.version }}; do
            if [[ "$BUILD_ARM" == "true" ]]; then
              MANIFEST_LIST="$REPO:$TAG-amd64 $REPO:$TAG-arm64"
            else
              MANIFEST_LIST="$REPO:$TAG-amd64"
            fi
            echo "[🔁 pushing ] $REPO:$TAG"
            docker manifest create $REPO:$TAG $MANIFEST_LIST
            docker manifest push $REPO:$TAG
          done
  build:
    needs: [base, merge-manifest]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{
          (inputs.build_arm == true && fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm"]')) ||
          fromJSON('["ubuntu-26.04"]')
          }}
        service: ${{ fromJSON(needs.base.outputs.services) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: '${{ github.event.inputs.branch_tag_name }}'

      - uses: actions/checkout@v6
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Set architecture label
        id: arch_label
        run: |
          if [[ "${{ matrix.runner }}" == "ubuntu-26.04-arm" ]]; then
            echo "arch=-arm64" >> $GITHUB_OUTPUT
          else
            echo "arch=-amd64" >> $GITHUB_OUTPUT
          fi

      - name: Set package name
        id: package
        run: |
          service="${{ matrix.service }}"
          echo "name=${service#ocrvs-}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          action: docker/build-push-action@v7
          with: |
            file: packages/${{ steps.package.outputs.name }}/Dockerfile
            build-args: |
              VERSION=${{ needs.base.outputs.version }}
              BRANCH=${{ needs.base.outputs.branch }}
            provenance: false
            push: true
            context: .
            tags: |
              ${{ env.CONTAINER_REGISTRY }}/${{ matrix.service }}:${{ needs.base.outputs.version }}${{ steps.arch_label.outputs.arch }}
              ${{ env.CONTAINER_REGISTRY }}/${{ matrix.service }}:${{ needs.base.outputs.branch }}${{ steps.arch_label.outputs.arch }}
            cache-from: type=registry,ref=${{ env.CONTAINER_REGISTRY }}/${{ matrix.service }}:${{ needs.base.outputs.branch }}${{ steps.arch_label.outputs.arch }}
            cache-to: type=inline

  merge-services-manifest:
    needs: [base, build, merge-testland-assets-manifest]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.base.outputs.services) }}
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          BUILD_ARM: ${{ inputs.build_arm == true || startsWith(github.ref, 'refs/tags/') }}
        run: |
          REPO="$CONTAINER_REGISTRY/${{ matrix.service }}"

          for TAG in ${{ needs.base.outputs.branch }} ${{ needs.base.outputs.version }}; do
            # Create manifest list based on whether ARM build exists
            if [[ "$BUILD_ARM" == "true" ]]; then
              MANIFEST_LIST="$REPO:$TAG-amd64 $REPO:$TAG-arm64"
            else
              MANIFEST_LIST="$REPO:$TAG-amd64"
            fi
            echo "[🔁 pushing ] $REPO:$TAG"
            docker manifest create $REPO:$TAG $MANIFEST_LIST
            docker manifest push $REPO:$TAG
          done

  # The service matrix above only builds packages/<service>/Dockerfile, so the
  # testland companion assets image (postgres/metabase/reindex assets) needs its
  # own step. Published as ocrvs-testland:<tag>-assets to match
  # the chart's `{{ opencrvs.image countryconfig }}-assets` reference. Context is
  # packages/testland because Dockerfile.assets COPYs testland-relative paths.
  testland-assets:
    needs: [base]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{
          (inputs.build_arm == true && fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm"]')) ||
          fromJSON('["ubuntu-26.04"]')
          }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: '${{ github.event.inputs.branch_tag_name }}'

      - uses: actions/checkout@v6
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Set architecture label
        id: arch_label
        run: |
          if [[ "${{ matrix.runner }}" == "ubuntu-26.04-arm" ]]; then
            echo "arch=-arm64" >> $GITHUB_OUTPUT
          else
            echo "arch=-amd64" >> $GITHUB_OUTPUT
          fi

      - name: Build and push testland assets image
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          action: docker/build-push-action@v7
          with: |
            file: packages/testland/Dockerfile.assets
            provenance: false
            push: true
            context: packages/testland
            tags: |
              ${{ env.CONTAINER_REGISTRY }}/ocrvs-testland:${{ needs.base.outputs.version }}${{ steps.arch_label.outputs.arch }}-assets
              ${{ env.CONTAINER_REGISTRY }}/ocrvs-testland:${{ needs.base.outputs.branch }}${{ steps.arch_label.outputs.arch }}-assets
            cache-from: type=registry,ref=${{ env.CONTAINER_REGISTRY }}/ocrvs-testland:${{ needs.base.outputs.branch }}${{ steps.arch_label.outputs.arch }}-assets
            cache-to: type=inline

  countryconfig-template-build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: '${{ github.event.inputs.branch_tag_name }}'

      - uses: actions/checkout@v6
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build countryconfig-template (without publishing)
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          action: docker/build-push-action@v7
          with: |
            file: packages/countryconfig-template/Dockerfile
            context: packages/countryconfig-template
            push: false

      - name: Build countryconfig-template assets (without publishing)
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          action: docker/build-push-action@v7
          with: |
            file: packages/countryconfig-template/Dockerfile.assets
            context: packages/countryconfig-template
            push: false

  merge-testland-assets-manifest:
    needs: [base, testland-assets]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          BUILD_ARM: ${{ inputs.build_arm == true }}
        run: |
          REPO="$CONTAINER_REGISTRY/ocrvs-testland"

          for TAG in ${{ needs.base.outputs.branch }} ${{ needs.base.outputs.version }}; do
            if [[ "$BUILD_ARM" == "true" ]]; then
              MANIFEST_LIST="$REPO:$TAG-amd64-assets $REPO:$TAG-arm64-assets"
            else
              MANIFEST_LIST="$REPO:$TAG-amd64-assets"
            fi
            echo "[🔁 pushing ] $REPO:$TAG-assets"
            docker manifest create $REPO:$TAG-assets $MANIFEST_LIST
            docker manifest push $REPO:$TAG-assets
          done

  security-scans-pr:
    needs: [build, base]
    runs-on: ubuntu-26.04
    if: >
      github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main') && !inputs.skip_security_check
    strategy:
      matrix:
        service: ${{ fromJSON(needs.base.outputs.services) }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            trivy.yaml
            .trivyignore.yaml
          sparse-checkout-cone-mode: false
      - name: Gather Trivy output from base branch image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.CONTAINER_REGISTRY }}/${{ matrix.service }}:${{ github.event.pull_request.base.ref }}'
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: 'sarif'
          output: './trivy-results-base.sarif'
          exit-code: '0'
      - name: Gather Trivy output from newly build image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.CONTAINER_REGISTRY }}/${{ matrix.service }}:${{ needs.base.outputs.version }}'
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: 'sarif'
          output: './trivy-results-branch.sarif'
          exit-code: '0'
      - name: Remove lines that are always expected to be different
        run: |
          jq '.runs |= map(del(.originalUriBaseIds, .properties))' ${{ github.workspace }}/trivy-results-base.sarif > ${{ github.workspace }}/trivy-results-base.sarif
          jq '.runs |= map(del(.originalUriBaseIds, .properties))' ${{ github.workspace }}/trivy-results-branch.sarif > ${{ github.workspace }}/trivy-results-branch.sarif

      - name: Diff Trivy results to catch newly introduced vulnerabilities
        run: diff -u ./trivy-results-base.sarif ./trivy-results-branch.sarif

  security-scans-develop:
    needs: [build, base]
    runs-on: ubuntu-26.04
    if: ${{ (needs.base.outputs.branch == 'develop' || inputs.publish_release) && !inputs.skip_security_check }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.base.outputs.services) }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            trivy.yaml
            .trivyignore.yaml
          sparse-checkout-cone-mode: false
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.CONTAINER_REGISTRY }}/${{ matrix.service }}:${{ needs.base.outputs.version }}'
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

  # Testland's single-instance e2e environment redeploys and re-tests on every
  # develop push. Dispatched only after the image manifests are pushed, so the
  # tags the e2e deploy pulls are guaranteed to exist (a standalone push-
  # triggered workflow would race this build).
  trigger-e2e:
    name: Trigger E2E in Testland development environment
    needs:
      [base, build, merge-services-manifest, merge-testland-assets-manifest]
    if: success() && github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.TESTLAND_WORKFLOW_TOKEN }}
          script: |
            const result = await github.rest.repos.createDispatchEvent({
              owner: 'opencrvs',
              repo: 'opencrvs-testland-infrastructure',
              event_type: 'run_e2e',
              client_payload: {
                actor: '${{ github.actor }}',
                'core-image-tag': '${{ needs.base.outputs.version }}',
                'core-branch': 'develop'
              }
            })
            console.log(result);
